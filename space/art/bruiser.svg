<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 90">
  <!-- BRUISER. Big, slow, purple armoured gunboat.
       Its three cannons point down at you and fire a fan of three shots.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="br-hull" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="86" y2="84"><stop offset="0" stop-color="#c8bce2"/><stop offset="0.35" stop-color="#6a5e8c"/><stop offset="0.7" stop-color="#2e2644"/><stop offset="1" stop-color="#14101e"/></linearGradient>
    <linearGradient id="br-plate" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="96" y2="70"><stop offset="0" stop-color="#9a90b8"/><stop offset="0.45" stop-color="#463e64"/><stop offset="1" stop-color="#181424"/></linearGradient>
    <radialGradient id="br-fire" cy="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#d9c2ff"/><stop offset="0.6" stop-color="#9b5cff"/><stop offset="1" stop-color="#9b5cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="br-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe4ff"/><stop offset="0.5" stop-color="#9b5cff"/><stop offset="1" stop-color="#2a0e5a"/></linearGradient>
    <linearGradient id="br-gun" x1="0" x2="1"><stop offset="0" stop-color="#dcdfe8"/><stop offset="0.5" stop-color="#7c8090"/><stop offset="1" stop-color="#22252e"/></linearGradient>
    <clipPath id="br-stripeclip"><path d="M14 22 L2 42 L5 58 L18 64 L14 44 Z M82 22 L94 42 L91 58 L78 64 L82 44 Z"/></clipPath>
  </defs>
  <!-- engine flames -->
  <ellipse cx="30" cy="7" rx="5.5" ry="8" fill="url(#br-fire)"/>
  <ellipse cx="42" cy="6" rx="5" ry="7.5" fill="url(#br-fire)"/>
  <ellipse cx="54" cy="6" rx="5" ry="7.5" fill="url(#br-fire)"/>
  <ellipse cx="66" cy="7" rx="5.5" ry="8" fill="url(#br-fire)"/>
  <!-- engine block -->
  <path d="M24 10 L72 10 L74 22 L22 22 Z" fill="#1c1e26" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#c8a6ff"><rect x="26" y="11" width="8" height="2"/><rect x="38" y="11" width="8" height="2"/><rect x="50" y="11" width="8" height="2"/><rect x="62" y="11" width="8" height="2"/></g>
  <path d="M36 11 L36 21 M48 11 L48 21 M60 11 L60 21" stroke="#06080d" stroke-width="1.2"/>
  <!-- side armour blades with purple hazard stripes -->
  <path d="M14 22 L2 42 L5 58 L18 64 L14 44 Z" fill="url(#br-plate)" stroke="#06080d" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M82 22 L94 42 L91 58 L78 64 L82 44 Z" fill="url(#br-plate)" stroke="#06080d" stroke-width="1.8" stroke-linejoin="round"/>
  <g clip-path="url(#br-stripeclip)" fill="#9b5cff">
    <path d="M0 50 L6 46 L6 50 L0 54 Z M0 57 L8 52 L8 56 L0 61 Z M0 64 L12 57 L12 61 L0 68 Z"/>
    <path d="M96 50 L90 46 L90 50 L96 54 Z M96 57 L88 52 L88 56 L96 61 Z M96 64 L84 57 L84 61 L96 68 Z"/>
  </g>
  <path d="M4 42 L14 26 M92 42 L82 26" stroke="#9b5cff" stroke-width="1.6"/>
  <!-- side cannons, angled out for the fan -->
  <g transform="rotate(12 30 64)">
    <rect x="27.6" y="60" width="4.8" height="25" fill="url(#br-gun)" stroke="#06080d" stroke-width="1"/>
    <rect x="26.5" y="72" width="7" height="4" fill="#3a3d48" stroke="#06080d" stroke-width="0.8"/>
    <rect x="28.6" y="83" width="2.8" height="2" fill="#9b5cff"/>
  </g>
  <g transform="rotate(-12 66 64)">
    <rect x="63.6" y="60" width="4.8" height="25" fill="url(#br-gun)" stroke="#06080d" stroke-width="1"/>
    <rect x="62.5" y="72" width="7" height="4" fill="#3a3d48" stroke="#06080d" stroke-width="0.8"/>
    <rect x="64.6" y="83" width="2.8" height="2" fill="#9b5cff"/>
  </g>
  <!-- centre cannon -->
  <rect x="45.2" y="64" width="5.6" height="25" fill="url(#br-gun)" stroke="#06080d" stroke-width="1"/>
  <rect x="44" y="78" width="8" height="3.4" fill="#3a3d48" stroke="#06080d" stroke-width="0.8"/>
  <rect x="46.4" y="86.6" width="3.2" height="2" fill="#9b5cff"/>
  <!-- main hull -->
  <path d="M48 76 L34 72 L18 62 L13 40 L18 20 L78 20 L83 40 L78 62 L62 72 Z" fill="url(#br-hull)" stroke="#06080d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M48 74 L34.6 70 L19.6 60.6 L14.8 40 L19.4 21.8 L48 21.8 Z" fill="#ffffff" opacity="0.13"/>
  <path d="M48 74 L61.4 70 L76.4 60.6 L81.2 40 L76.6 21.8 L48 21.8 Z" fill="#000000" opacity="0.22"/>
  <!-- two raised armour plates with a trench down the middle -->
  <path d="M44 26 L31 26 L26.5 38 L30 57 L44 64 Z" fill="url(#br-plate)" stroke="#06080d" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M52 26 L65 26 L69.5 38 L66 57 L52 64 Z" fill="url(#br-plate)" stroke="#06080d" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M43 27.4 L31.8 27.4 L28 38 L31.2 56 L43 61.8 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M53 27.4 L64.2 27.4 L68 38 L64.8 56 L53 61.8 Z" fill="#000000" opacity="0.2"/>
  <path d="M30.6 57.6 L44 64 M65.4 57.6 L52 64" stroke="#9b5cff" stroke-width="1.6"/>
  <path d="M27.5 40 L44 40 M52 40 L68.5 40 M29.5 50 L44 50 M52 50 L66.5 50" stroke="#06080d" stroke-width="0.9" opacity="0.7"/>
  <path d="M18 30 L28 30 M68 30 L78 30 M16 50 L28 50 M68 50 L80 50" stroke="#06080d" stroke-width="0.9" opacity="0.6"/>
  <!-- side cannon turrets -->
  <path d="M24 61 L34 61 L35.5 66 L32 70 L26 70 L22.5 66 Z M62 61 L72 61 L73.5 66 L70 70 L64 70 L60.5 66 Z" fill="#262532" stroke="#06080d" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M25 62.4 L33 62.4 M63 62.4 L71 62.4" stroke="#9a90b8" stroke-width="0.9"/>
  <g fill="#9b5cff"><rect x="27.6" y="65" width="2.8" height="1.8"/><rect x="65.6" y="65" width="2.8" height="1.8"/></g>
  <!-- trench with a purple stripe and the sensor slit at the front -->
  <path d="M44 26 L52 26 L52 64 L48 70 L44 64 Z" fill="#1a1922" stroke="#06080d" stroke-width="1" stroke-linejoin="round"/>
  <rect x="46.6" y="27" width="2.8" height="19" fill="#9b5cff"/>
  <path d="M46 50 L50 50 L50 62 L48 66 L46 62 Z" fill="url(#br-glass)" stroke="#06080d" stroke-width="0.8"/>
  <g fill="#0a0c12" opacity="0.75"><circle cx="22" cy="25" r="0.8"/><circle cx="74" cy="25" r="0.8"/><circle cx="18" cy="42" r="0.8"/><circle cx="78" cy="42" r="0.8"/><circle cx="24" cy="60" r="0.8"/><circle cx="72" cy="60" r="0.8"/><circle cx="33" cy="28.5" r="0.7"/><circle cx="63" cy="28.5" r="0.7"/></g>
</svg>
