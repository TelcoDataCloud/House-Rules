<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 90">
  <!-- BRUISER. Big, slow, purple gunship. Fires three shots in a fan. -->
  <defs>
    <radialGradient id="glow-pink"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ff5fc0"/><stop offset="1" stop-color="#ff2a9a" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="30" cy="8" r="10" fill="url(#glow-pink)"/>
  <circle cx="66" cy="8" r="10" fill="url(#glow-pink)"/>
  <!-- engines -->
  <rect x="22" y="6" width="16" height="16" rx="4" fill="#3c1a70" stroke="#1e0a3c" stroke-width="2.5"/>
  <rect x="58" y="6" width="16" height="16" rx="4" fill="#3c1a70" stroke="#1e0a3c" stroke-width="2.5"/>
  <!-- hull -->
  <path d="M48 80 L8 44 L16 18 L80 18 L88 44 Z" fill="#9b5cff" stroke="#1e0a3c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M48 80 L88 44 L80 18 L48 18 Z" fill="#5e2fb0"/>
  <path d="M44 70 L15 44 L21 24 L44 24 Z" fill="#c9a6ff" opacity="0.6"/>
  <path d="M20 34 L76 34 M26 52 L70 52" stroke="#1e0a3c" stroke-width="1.5" opacity="0.6"/>
  <g fill="#1e0a3c" opacity="0.6"><circle cx="24" cy="28" r="1.5"/><circle cx="72" cy="28" r="1.5"/><circle cx="30" cy="58" r="1.5"/><circle cx="66" cy="58" r="1.5"/></g>
  <!-- three guns pointing down -->
  <rect x="25" y="56" width="10" height="18" rx="3" fill="#c9a6ff" stroke="#1e0a3c" stroke-width="2"/>
  <rect x="43" y="66" width="10" height="20" rx="3" fill="#c9a6ff" stroke="#1e0a3c" stroke-width="2"/>
  <rect x="61" y="56" width="10" height="18" rx="3" fill="#c9a6ff" stroke="#1e0a3c" stroke-width="2"/>
  <!-- cockpit -->
  <circle cx="48" cy="42" r="12" fill="#1e0a3c"/>
  <circle cx="48" cy="42" r="8" fill="#4de3ff"/>
  <circle cx="48" cy="43" r="3.5" fill="#1a5f70"/>
  <ellipse cx="45" cy="39" rx="2.5" ry="2" fill="#ffffff"/>
</svg>
