<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230">
  <!-- SKY FORTRESS, the level 2 boss. A flying castle with
       big propeller pods. Its six turrets and its eye are separate
       pictures (core-turret.svg and core-eye.svg). -->
  <defs>
    <linearGradient id="fo-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6c8"/><stop offset="0.3" stop-color="#c8865a"/><stop offset="0.7" stop-color="#7a4a2e"/><stop offset="1" stop-color="#2a160c"/></linearGradient>
    <linearGradient id="fo-pod" x1="0" x2="1"><stop offset="0" stop-color="#d8dcef"/><stop offset="0.5" stop-color="#7a7f99"/><stop offset="1" stop-color="#1a1d2e"/></linearGradient>
    <radialGradient id="fo-socket" cx="0.5" cy="0.5"><stop offset="0.6" stop-color="#0d1226"/><stop offset="1" stop-color="#4a2e1c"/></radialGradient>
    <radialGradient id="fo-glow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#9ff6ff"/><stop offset="1" stop-color="#38f0ff" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- propeller pods -->
  <g>
    <ellipse cx="30" cy="70" rx="26" ry="10" fill="url(#fo-glow)" opacity="0.7"/>
    <rect x="12" y="40" width="36" height="56" rx="14" fill="url(#fo-pod)" stroke="#1a1d2e" stroke-width="2.6"/>
    <ellipse cx="350" cy="70" rx="26" ry="10" fill="url(#fo-glow)" opacity="0.7"/>
    <rect x="332" y="40" width="36" height="56" rx="14" fill="url(#fo-pod)" stroke="#1a1d2e" stroke-width="2.6"/>
    <rect x="18" y="46" width="6" height="44" rx="3" fill="#ffffff" opacity="0.4"/>
    <rect x="338" y="46" width="6" height="44" rx="3" fill="#ffffff" opacity="0.4"/>
  </g>
  <!-- main hull: a flying castle -->
  <path d="M48 50 L110 20 L270 20 L332 50 L340 130 L290 190 L90 190 L40 130 Z" fill="url(#fo-hull)" stroke="#2a160c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M58 56 L112 30 L180 28 L180 38 L118 42 L68 66 Z" fill="#ffffff" opacity="0.35"/>
  <!-- battlements along the top -->
  <g fill="url(#fo-hull)" stroke="#2a160c" stroke-width="2">
    <rect x="118" y="8" width="20" height="16"/><rect x="152" y="8" width="20" height="16"/><rect x="208" y="8" width="20" height="16"/><rect x="242" y="8" width="20" height="16"/>
  </g>
  <path d="M40 130 L340 130 M60 90 L320 90 M130 20 L130 190 M250 20 L250 190" stroke="#2a160c" stroke-width="1.6" opacity="0.45"/>
  <g fill="#2a160c" opacity="0.6">
    <circle cx="80" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="110" cy="160" r="2"/><circle cx="270" cy="160" r="2"/>
  </g>
  <path d="M90 190 L110 176 L130 190 M250 190 L270 176 L290 190" stroke="#ffd23f" stroke-width="4" fill="none"/>
  <g fill="#38f0ff"><circle cx="70" cy="60" r="3"/><circle cx="310" cy="60" r="3"/><circle cx="190" cy="186" r="3"/></g>
  <circle cx="190" cy="100" r="58" fill="url(#fo-socket)" stroke="#0d1226" stroke-width="3"/>
  <circle cx="190" cy="100" r="51" fill="none" stroke="#ffd23f" stroke-width="2" stroke-dasharray="8 10"/>
</svg>
