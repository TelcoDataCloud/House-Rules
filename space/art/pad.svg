<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <!-- LANDING PAD. Just for show. Marks where a base starts.
       Hendrix: the big H is made of three rectangles. Find them! -->
  <defs>
    <filter id="pd-blur" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="pd-floor" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="116" y2="76"><stop offset="0" stop-color="#8e908a"/><stop offset="0.5" stop-color="#62645f"/><stop offset="1" stop-color="#363836"/></linearGradient>
    <radialGradient id="pd-ring" cx="0.4" cy="0.36" r="0.7"><stop offset="0" stop-color="#5c5f60"/><stop offset="1" stop-color="#2a2c2e"/></radialGradient>
    <radialGradient id="pd-burn" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- shadow -->
  <path d="M20 8 L104 8 L120 24 L120 64 L104 80 L20 80 L6 64 L6 24 Z" fill="#000" opacity="0.45" filter="url(#pd-blur)"/>
  <!-- the eight sided concrete apron -->
  <path d="M17 4 L101 4 L116 19 L116 61 L101 76 L17 76 L2 61 L2 19 Z" fill="url(#pd-floor)" stroke="#07090d" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M3.6 60 L3.6 19.6 L17.6 5.6 L100.4 5.6" fill="none" stroke="#e6e6de" stroke-width="1" opacity="0.4"/>
  <!-- slab joints -->
  <path d="M2 40 L116 40 M30 4 L30 76 M88 4 L88 76" stroke="#26282a" stroke-width="0.7" opacity="0.55"/>
  <!-- hazard chevrons at each side -->
  <g fill="#d9a520" stroke="#07090d" stroke-width="0.6">
    <path d="M7 32 L14 40 L7 48 L11 48 L18 40 L11 32 Z"/><path d="M15 32 L22 40 L15 48 L19 48 L26 40 L19 32 Z"/>
    <path d="M111 32 L104 40 L111 48 L107 48 L100 40 L107 32 Z"/><path d="M103 32 L96 40 L103 48 L99 48 L92 40 L99 32 Z"/>
  </g>

  <!-- the round landing circle -->
  <circle cx="59" cy="40" r="32" fill="url(#pd-ring)" stroke="#07090d" stroke-width="1.6"/>
  <circle cx="59" cy="40" r="29" fill="none" stroke="#d9a520" stroke-width="2.4"/>
  <circle cx="59" cy="40" r="29" fill="none" stroke="#141414" stroke-width="2.4" stroke-dasharray="6 6"/>
  <circle cx="59" cy="40" r="24" fill="url(#pd-burn)"/>
  <circle cx="59" cy="40" r="22" fill="none" stroke="#e8e8e0" stroke-width="1" opacity="0.6" stroke-dasharray="2 4"/>
  <!-- the big H -->
  <g fill="#e8e8e0" opacity="0.88" stroke="#07090d" stroke-width="0.6">
    <rect x="47" y="27" width="5" height="26"/><rect x="66" y="27" width="5" height="26"/><rect x="52" y="37.5" width="14" height="5"/>
  </g>
  <!-- scuffs from landing feet -->
  <g fill="#1a1a1a" opacity="0.35"><rect x="40" y="22" width="5" height="3" rx="1"/><rect x="73" y="22" width="5" height="3" rx="1"/><rect x="40" y="55" width="5" height="3" rx="1"/><rect x="73" y="55" width="5" height="3" rx="1"/></g>

  <!-- edge lights, cyan on the left, amber on the right -->
  <g fill="#38f0ff" stroke="#07090d" stroke-width="0.5"><circle cx="59" cy="9" r="1.6"/><circle cx="37" cy="18" r="1.4"/><circle cx="28" cy="40" r="1.6"/><circle cx="37" cy="62" r="1.4"/></g>
  <g fill="#ffb02a" stroke="#07090d" stroke-width="0.5"><circle cx="59" cy="71" r="1.6"/><circle cx="81" cy="18" r="1.4"/><circle cx="90" cy="40" r="1.6"/><circle cx="81" cy="62" r="1.4"/></g>
  <circle cx="18" cy="8" r="1.1" fill="#ff3b2a"/>
  <circle cx="100" cy="8" r="1.1" fill="#ff3b2a"/>
</svg>
