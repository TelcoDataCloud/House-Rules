<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 70">
  <!-- One engine pod of the Hauler. The flame is at the top, because
       the Hauler flies nose down. Shoot both off and the body opens.
       Hendrix: every fill is a colour. -->
  <defs>
    <radialGradient id="he-flame"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ffe08a"/><stop offset="0.65" stop-color="#ff8a1a"/><stop offset="1" stop-color="#ff4a00" stop-opacity="0"/></radialGradient>
    <linearGradient id="he-pod" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3c278"/><stop offset="0.4" stop-color="#5f6d34"/><stop offset="1" stop-color="#1c220c"/></linearGradient>
    <linearGradient id="he-metal" x1="0" x2="1"><stop offset="0" stop-color="#d8d8d2"/><stop offset="0.45" stop-color="#73746c"/><stop offset="1" stop-color="#1d1e1a"/></linearGradient>
    <pattern id="he-haz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#16181d"/><rect width="3" height="6" fill="#e8b81c"/></pattern>
  </defs>
  <!-- the flame out of the back -->
  <ellipse cx="20" cy="7" rx="13" ry="7" fill="url(#he-flame)"/>
  <!-- nozzle -->
  <path d="M9 6 L31 6 L33 14 L7 14 Z" fill="url(#he-metal)" stroke="#101216" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="20" cy="7.5" rx="8" ry="2.4" fill="#fff2c0"/>
  <!-- the armoured pod -->
  <path d="M6 14 L34 14 L37 22 L37 56 L31 66 L9 66 L3 56 L3 22 Z" fill="url(#he-pod)" stroke="#101216" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M7 18 L13 18 L13 54 L7 54 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M3 30 L37 30 M3 48 L37 48 M20 14 L20 30" stroke="#101216" stroke-width="1.2" opacity="0.6"/>
  <!-- cooling slots that glow -->
  <g fill="#0e1014"><rect x="16" y="34" width="16" height="2"/><rect x="16" y="38" width="16" height="2"/><rect x="16" y="42" width="16" height="2"/></g>
  <g fill="#ff8a2a" opacity="0.7"><rect x="18" y="34.5" width="12" height="1"/><rect x="18" y="38.5" width="12" height="1"/></g>
  <!-- hazard band and the intake at the front -->
  <rect x="4" y="50" width="32" height="5" fill="url(#he-haz)" stroke="#101216" stroke-width="1"/>
  <path d="M11 58 L29 58 L27 64 L13 64 Z" fill="#171815" stroke="#101216" stroke-width="1.2"/>
  <path d="M14 60 L26 60 M15 62 L25 62" stroke="#50514b" stroke-width="0.8"/>
  <g fill="#101216" opacity="0.8"><circle cx="6" cy="24" r="1"/><circle cx="34" cy="24" r="1"/><circle cx="6" cy="44" r="1"/><circle cx="34" cy="44" r="1"/></g>
  <rect x="5" y="22" width="2" height="5" fill="#ffb02a"/>
</svg>
