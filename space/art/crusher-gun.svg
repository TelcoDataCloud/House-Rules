<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 64">
  <!-- One side gun of the Crusher: a heavy armoured box with two big
       barrels pointing down at you. Shoot both off to open its hatch.
       Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="cgn-house" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d0d6e0"/><stop offset="0.35" stop-color="#737b8c"/><stop offset="0.75" stop-color="#343946"/><stop offset="1" stop-color="#14161c"/></linearGradient>
    <linearGradient id="cgn-barrel" x1="0" x2="1"><stop offset="0" stop-color="#dde1e8"/><stop offset="0.45" stop-color="#6a7180"/><stop offset="1" stop-color="#16181e"/></linearGradient>
    <radialGradient id="cgn-muzzle"><stop offset="0" stop-color="#fff2d0"/><stop offset="0.45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <pattern id="cgn-haz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#14161b"/><rect width="2.5" height="5" fill="#ffb21a"/></pattern>
  </defs>
  <!-- two heavy barrels with muzzle brakes -->
  <rect x="11.4" y="32" width="7" height="24" fill="url(#cgn-barrel)" stroke="#0b0c10" stroke-width="1.3"/>
  <rect x="25.6" y="32" width="7" height="24" fill="url(#cgn-barrel)" stroke="#0b0c10" stroke-width="1.3"/>
  <g fill="#2a2e36" stroke="#0b0c10" stroke-width="1.1"><rect x="9.6" y="53" width="10.6" height="7" rx="1"/><rect x="23.8" y="53" width="10.6" height="7" rx="1"/></g>
  <path d="M9.6 56.5 L20.2 56.5 M23.8 56.5 L34.4 56.5" stroke="#0b0c10" stroke-width="0.9"/>
  <circle cx="14.9" cy="61.4" r="3" fill="url(#cgn-muzzle)"/>
  <circle cx="29.1" cy="61.4" r="3" fill="url(#cgn-muzzle)"/>
  <!-- the armoured box -->
  <path d="M10 3 L34 3 L41 10 L41 34 L35 41 L9 41 L3 34 L3 10 Z" fill="url(#cgn-house)" stroke="#0b0c10" stroke-width="2" stroke-linejoin="round"/>
  <path d="M11 5.4 L32 5.4 L30.6 8 L12 8.2 L6 13 L6 31 L5 30 L5 11.4 Z" fill="#ffffff" opacity="0.33"/>
  <path d="M38.6 11 L38.6 33 L33.8 38.6 L31.4 38.6 L36.4 32.4 L36.4 12 Z" fill="#000000" opacity="0.25"/>
  <!-- top armour plate with vents -->
  <path d="M10 9 L34 9 L35 20 L9 20 Z" fill="#2a2e38" stroke="#0b0c10" stroke-width="1.1" stroke-linejoin="round"/>
  <g fill="#0b0c10"><rect x="12" y="11.4" width="20" height="1.4"/><rect x="12" y="14.2" width="20" height="1.4"/><rect x="12" y="17" width="20" height="1.4"/></g>
  <!-- orange sensor slit and the hazard band -->
  <rect x="10" y="23" width="24" height="4" rx="1" fill="#0b0c10"/>
  <rect x="11.4" y="24" width="21.2" height="2" fill="#ff7a1a"/>
  <rect x="8" y="30" width="28" height="5" fill="url(#cgn-haz)" stroke="#0b0c10" stroke-width="0.9"/>
  <path d="M22 3 L22 9" stroke="#0b0c10" stroke-width="1" opacity="0.6"/>
  <g fill="#0b0c10" opacity="0.75"><circle cx="6.4" cy="12" r="1"/><circle cx="37.6" cy="12" r="1"/><circle cx="6.4" cy="32" r="1"/><circle cx="37.6" cy="32" r="1"/></g>
</svg>
