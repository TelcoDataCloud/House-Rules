<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 96">
  <!-- GUNSHIP. Heavy green warship. Its five cannons point down at you
       and fire a fan of five. The big engines glow at the top.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="gs-hull" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="90" y2="86"><stop offset="0" stop-color="#bcd0c4"/><stop offset="0.35" stop-color="#5c7266"/><stop offset="0.7" stop-color="#27342e"/><stop offset="1" stop-color="#101814"/></linearGradient>
    <linearGradient id="gs-plate" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="110" y2="70"><stop offset="0" stop-color="#98a29e"/><stop offset="0.45" stop-color="#454d4a"/><stop offset="1" stop-color="#181c1b"/></linearGradient>
    <radialGradient id="gs-fire" cy="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#c8ffd8"/><stop offset="0.6" stop-color="#4dff7c"/><stop offset="1" stop-color="#4dff7c" stop-opacity="0"/></radialGradient>
    <linearGradient id="gs-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6ffe9"/><stop offset="0.5" stop-color="#4dff7c"/><stop offset="1" stop-color="#0a4a1e"/></linearGradient>
    <linearGradient id="gs-gun" x1="0" x2="1"><stop offset="0" stop-color="#dcdfe8"/><stop offset="0.5" stop-color="#7c8090"/><stop offset="1" stop-color="#22252e"/></linearGradient>
  </defs>
  <!-- engine flames -->
  <ellipse cx="37" cy="7" rx="6" ry="8" fill="url(#gs-fire)"/>
  <ellipse cx="49" cy="6" rx="5" ry="7.5" fill="url(#gs-fire)"/>
  <ellipse cx="61" cy="6" rx="5" ry="7.5" fill="url(#gs-fire)"/>
  <ellipse cx="73" cy="7" rx="6" ry="8" fill="url(#gs-fire)"/>
  <!-- swept wings -->
  <path d="M32 60 L3 46 L2 32 L9 30 L32 34 Z" fill="url(#gs-plate)" stroke="#06080d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M78 60 L107 46 L108 32 L101 30 L78 34 Z" fill="url(#gs-plate)" stroke="#06080d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 60 L3 46 L3 42.6 L32 56.4 Z" fill="#4dff7c"/>
  <path d="M78 60 L107 46 L107 42.6 L78 56.4 Z" fill="#2fbf58"/>
  <path d="M28 46 L6 38 M82 46 L104 38 M20 32 L20 51 M90 32 L90 51" stroke="#06080d" stroke-width="0.9" opacity="0.6"/>
  <!-- wing missile pods -->
  <path d="M10 28 L16 28 L16 44 L13 47 L10 44 Z M100 28 L94 28 L94 44 L97 47 L100 44 Z" fill="#23272a" stroke="#06080d" stroke-width="1.1"/>
  <g fill="#4dff7c"><rect x="10.8" y="36" width="4.4" height="1.6"/><rect x="94.8" y="36" width="4.4" height="1.6"/></g>
  <!-- engine block -->
  <path d="M30 10 L80 10 L82 22 L28 22 Z" fill="#1c1e22" stroke="#06080d" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="#a8ffc0"><rect x="32" y="11" width="9" height="2"/><rect x="45" y="11" width="8" height="2"/><rect x="57" y="11" width="8" height="2"/><rect x="69" y="11" width="9" height="2"/></g>
  <path d="M43 11 L43 21 M55 11 L55 21 M67 11 L67 21" stroke="#06080d" stroke-width="1.2"/>
  <!-- five barrel cannon array, fanned -->
  <g fill="url(#gs-gun)" stroke="#06080d" stroke-width="1">
    <rect x="38.6" y="66" width="3.8" height="20" transform="rotate(10 40.5 68)"/>
    <rect x="46.6" y="68" width="3.8" height="22" transform="rotate(5 48.5 70)"/>
    <rect x="53" y="70" width="4" height="25"/>
    <rect x="59.6" y="68" width="3.8" height="22" transform="rotate(-5 61.5 70)"/>
    <rect x="67.6" y="66" width="3.8" height="20" transform="rotate(-10 69.5 68)"/>
  </g>
  <g fill="#4dff7c">
    <rect x="38.9" y="84" width="3.2" height="2" transform="rotate(10 40.5 68)"/>
    <rect x="46.9" y="88" width="3.2" height="2" transform="rotate(5 48.5 70)"/>
    <rect x="53.4" y="93" width="3.2" height="2"/>
    <rect x="59.9" y="88" width="3.2" height="2" transform="rotate(-5 61.5 70)"/>
    <rect x="67.9" y="84" width="3.2" height="2" transform="rotate(-10 69.5 68)"/>
  </g>
  <!-- main hull -->
  <path d="M55 82 L38 74 L28 62 L26 36 L31 20 L79 20 L84 36 L82 62 L72 74 Z" fill="url(#gs-hull)" stroke="#06080d" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M55 80 L38.8 72.4 L29.6 61.4 L27.8 36 L32.4 21.8 L55 21.8 Z" fill="#ffffff" opacity="0.13"/>
  <path d="M55 80 L71.2 72.4 L80.4 61.4 L82.2 36 L77.6 21.8 L55 21.8 Z" fill="#000000" opacity="0.22"/>
  <!-- gun housing -->
  <path d="M40 66 L70 66 L66 76 L44 76 Z" fill="#23272a" stroke="#06080d" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M47 66 L46 76 M55 66 L55 76 M63 66 L64 76" stroke="#06080d" stroke-width="1" opacity="0.8"/>
  <!-- two raised armour plates with a trench down the middle -->
  <path d="M51 26 L40 26 L35.5 36 L38 58 L51 64 Z" fill="url(#gs-plate)" stroke="#06080d" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M59 26 L70 26 L74.5 36 L72 58 L59 64 Z" fill="url(#gs-plate)" stroke="#06080d" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M50 27.4 L40.8 27.4 L37 36 L39.2 56.6 L50 61.8 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M60 27.4 L69.2 27.4 L73 36 L70.8 56.6 L60 61.8 Z" fill="#000000" opacity="0.2"/>
  <path d="M38.6 58.6 L51 64 M71.4 58.6 L59 64" stroke="#4dff7c" stroke-width="1.6"/>
  <path d="M36.5 44 L51 44 M59 44 L73.5 44 M37.5 53 L51 53 M59 53 L72.5 53" stroke="#06080d" stroke-width="0.9" opacity="0.7"/>
  <path d="M27 30 L37 30 M73 30 L83 30 M27.5 50 L37 50 M73 50 L82.5 50 M29 62 L39 62 M71 62 L81 62" stroke="#06080d" stroke-width="0.9" opacity="0.6"/>
  <!-- green hazard stripes on the flanks -->
  <path d="M28 38 L33 36 L33 39 L28 41 Z M28 43 L33 41 L33 44 L28 46 Z M82 38 L77 36 L77 39 L82 41 Z M82 43 L77 41 L77 44 L82 46 Z" fill="#4dff7c"/>
  <!-- trench with a green stripe and the sensor slit at the front -->
  <path d="M51 26 L59 26 L59 64 L55 69 L51 64 Z" fill="#1a1e1d" stroke="#06080d" stroke-width="1" stroke-linejoin="round"/>
  <rect x="53.6" y="27" width="2.8" height="19" fill="#4dff7c"/>
  <path d="M53 50 L57 50 L57 61 L55 65 L53 61 Z" fill="url(#gs-glass)" stroke="#06080d" stroke-width="0.8"/>
  <g fill="#0a0c12" opacity="0.75"><circle cx="34" cy="25" r="0.8"/><circle cx="76" cy="25" r="0.8"/><circle cx="29" cy="56" r="0.8"/><circle cx="81" cy="56" r="0.8"/><circle cx="40" cy="70" r="0.8"/><circle cx="70" cy="70" r="0.8"/><circle cx="25" cy="48" r="0.7"/><circle cx="85" cy="48" r="0.7"/></g>
</svg>
