<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- CARGO. A stack of shipping boxes with a surprise inside.
       The one on top sits across the two below it.
       Hendrix: each box has its own colour. Paint them! -->
  <defs>
    <filter id="cg-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <pattern id="cg-ribs" width="3" height="10" patternUnits="userSpaceOnUse"><rect width="1.4" height="10" fill="#000" opacity="0.25"/><rect x="1.4" width="0.6" height="10" fill="#fff" opacity="0.12"/></pattern>
    <pattern id="cg-ribs-h" width="10" height="3" patternUnits="userSpaceOnUse"><rect width="10" height="1.4" fill="#000" opacity="0.25"/><rect y="1.4" width="10" height="0.6" fill="#fff" opacity="0.12"/></pattern>
    <linearGradient id="cg-shade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/></linearGradient>
  </defs>

  <!-- shadow of the whole stack -->
  <path d="M8 10 L56 10 L56 58 L8 58 Z" fill="#000" opacity="0.5" filter="url(#cg-blur)"/>

  <!-- bottom left box, olive -->
  <rect x="5" y="6" width="23" height="48" rx="1" fill="#5e6640" stroke="#07090d" stroke-width="1.5"/>
  <rect x="5" y="6" width="23" height="48" rx="1" fill="url(#cg-ribs-h)"/>
  <rect x="5" y="6" width="23" height="48" rx="1" fill="url(#cg-shade)"/>
  <!-- bottom right box, rusty orange -->
  <rect x="30" y="6" width="23" height="48" rx="1" fill="#8a4a26" stroke="#07090d" stroke-width="1.5"/>
  <rect x="30" y="6" width="23" height="48" rx="1" fill="url(#cg-ribs-h)"/>
  <rect x="30" y="6" width="23" height="48" rx="1" fill="url(#cg-shade)"/>
  <path d="M34 50 Q40 46 44 52" fill="none" stroke="#3a1a0a" stroke-width="2" opacity="0.4"/>
  <!-- corner fittings -->
  <g fill="#1a1c1e"><rect x="5.5" y="6.5" width="3" height="3"/><rect x="24.5" y="6.5" width="3" height="3"/><rect x="5.5" y="50.5" width="3" height="3"/><rect x="24.5" y="50.5" width="3" height="3"/><rect x="30.5" y="6.5" width="3" height="3"/><rect x="49.5" y="6.5" width="3" height="3"/><rect x="30.5" y="50.5" width="3" height="3"/><rect x="49.5" y="50.5" width="3" height="3"/></g>

  <!-- the top box casts a shadow on the two below -->
  <rect x="9" y="21" width="47" height="21" fill="#000" opacity="0.55" filter="url(#cg-blur)"/>
  <!-- top box, steel blue grey, lying across -->
  <rect x="4" y="18" width="50" height="20" rx="1" fill="#56606c" stroke="#07090d" stroke-width="1.6"/>
  <rect x="4" y="18" width="50" height="20" rx="1" fill="url(#cg-ribs)"/>
  <rect x="4" y="18" width="50" height="20" rx="1" fill="url(#cg-shade)"/>
  <path d="M5.5 36 L5.5 19.5 L52.5 19.5" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.35"/>
  <g fill="#1a1c1e"><rect x="4.5" y="18.5" width="3" height="3"/><rect x="50.5" y="18.5" width="3" height="3"/><rect x="4.5" y="34.5" width="3" height="3"/><rect x="50.5" y="34.5" width="3" height="3"/></g>
  <!-- yellow lifting marks and a stencil stripe -->
  <rect x="25" y="20" width="8" height="16" fill="#d9a520" opacity="0.85"/>
  <path d="M25 22 L33 22 M25 34 L33 34" stroke="#141414" stroke-width="1.2"/>
  <!-- loose crate and a barrel on the side -->
  <rect x="44" y="44" width="10" height="10" fill="#7a6a48" stroke="#07090d" stroke-width="1"/>
  <path d="M44 44 L54 54 M54 44 L44 54" stroke="#3a2e1a" stroke-width="0.9"/>
  <circle cx="11" cy="47" r="4" fill="#3a5a8a" stroke="#07090d" stroke-width="1"/>
  <circle cx="10.4" cy="46.4" r="1.4" fill="#8ab0e0" opacity="0.7"/>
  <!-- little amber tracking light -->
  <circle cx="47" cy="28" r="1.4" fill="#ffb02a" stroke="#07090d" stroke-width="0.5"/>
</svg>
