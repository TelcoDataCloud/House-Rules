<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68">
  <!-- DIVER. Yellow dive bomber with a heavy armoured nose.
       It stops, flashes, then dives at where you were.
       The striped nose points down at you. Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="dv-hull" gradientUnits="userSpaceOnUse" x1="10" y1="6" x2="54" y2="66"><stop offset="0" stop-color="#c9c6bc"/><stop offset="0.35" stop-color="#6e6b62"/><stop offset="0.7" stop-color="#312f2a"/><stop offset="1" stop-color="#161512"/></linearGradient>
    <linearGradient id="dv-wing" gradientUnits="userSpaceOnUse" x1="2" y1="16" x2="62" y2="44"><stop offset="0" stop-color="#9c998e"/><stop offset="0.45" stop-color="#4c4a42"/><stop offset="1" stop-color="#1b1a17"/></linearGradient>
    <radialGradient id="dv-fire" cy="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#fff2a8"/><stop offset="0.6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
    <linearGradient id="dv-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6c8"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#5a3e00"/></linearGradient>
    <linearGradient id="dv-gun" x1="0" x2="1"><stop offset="0" stop-color="#d6dbe4"/><stop offset="1" stop-color="#2a2e38"/></linearGradient>
    <clipPath id="dv-noseclip"><path d="M32 66 L19 54 L21 45 L43 45 L45 54 Z"/></clipPath>
  </defs>
  <!-- engine flames -->
  <ellipse cx="25" cy="6" rx="4.5" ry="7" fill="url(#dv-fire)"/>
  <ellipse cx="39" cy="6" rx="4.5" ry="7" fill="url(#dv-fire)"/>
  <!-- tail fins -->
  <path d="M21 18 L12 8 L15 7 L23 14 Z M43 18 L52 8 L49 7 L41 14 Z" fill="url(#dv-wing)" stroke="#06080d" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- swept wings -->
  <path d="M19 40 L2 30 L3 21 L9 20 L19 25 Z" fill="url(#dv-wing)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M45 40 L62 30 L61 21 L55 20 L45 25 Z" fill="url(#dv-wing)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M19 40 L2 30 L2.3 27.4 L19 37 Z" fill="#ffd23f"/>
  <path d="M45 40 L62 30 L61.7 27.4 L45 37 Z" fill="#c9a020"/>
  <path d="M17 31 L5 25 M47 31 L59 25" stroke="#06080d" stroke-width="0.8" opacity="0.6"/>
  <!-- bomb racks under the wings -->
  <path d="M9 27 L13 27 L13 36 L11 38 L9 36 Z M55 27 L51 27 L51 36 L53 38 L55 36 Z" fill="#2a2a26" stroke="#06080d" stroke-width="0.9"/>
  <rect x="9.4" y="30" width="3.2" height="1.5" fill="#ffd23f"/>
  <rect x="51.4" y="30" width="3.2" height="1.5" fill="#ffd23f"/>
  <!-- engine nozzles -->
  <path d="M19.5 9 L30.5 9 L30 18 L20 18 Z M33.5 9 L44.5 9 L44 18 L34 18 Z" fill="#1c2028" stroke="#06080d" stroke-width="1.3"/>
  <rect x="21" y="9.7" width="8" height="1.8" fill="#ffe680"/>
  <rect x="35" y="9.7" width="8" height="1.8" fill="#ffe680"/>
  <!-- heavy guns beside the nose -->
  <rect x="16.4" y="44" width="2.4" height="16" fill="url(#dv-gun)" stroke="#06080d" stroke-width="0.7"/>
  <rect x="45.2" y="44" width="2.4" height="16" fill="url(#dv-gun)" stroke="#06080d" stroke-width="0.7"/>
  <!-- body -->
  <path d="M32 66 L19 54 L17 32 L20 15 L44 15 L47 32 L45 54 Z" fill="url(#dv-hull)" stroke="#06080d" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M32 64 L20.4 53 L18.6 32 L21.2 16.6 L32 16.6 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M32 64 L43.6 53 L45.4 32 L42.8 16.6 L32 16.6 Z" fill="#000000" opacity="0.22"/>
  <!-- armour plates -->
  <path d="M18.3 26 L45.7 26 M17.6 36 L46.4 36" stroke="#06080d" stroke-width="0.9" opacity="0.75"/>
  <path d="M32 16 L32 44" stroke="#06080d" stroke-width="0.7" opacity="0.5"/>
  <g stroke="#06080d" stroke-width="0.9" opacity="0.75"><path d="M29.5 19 L29.5 24 M32 19 L32 24 M34.5 19 L34.5 24"/></g>
  <!-- yellow and black hazard nose -->
  <g clip-path="url(#dv-noseclip)">
    <rect x="16" y="44" width="32" height="24" fill="#ffd23f"/>
    <path d="M14 48 L22 40 L26 40 L14 52 Z M14 58 L32 40 L36 40 L14 62 Z M20 66 L46 40 L50 40 L24 66 Z M30 66 L50 46 L50 50 L34 66 Z" fill="#14130f"/>
    <path d="M32 66 L44 54 L44 45 L32 45 Z" fill="#000000" opacity="0.25"/>
  </g>
  <path d="M32 66 L19 54 L21 45 L43 45 L45 54 Z" fill="none" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- sensor slit -->
  <path d="M22 39 L42 39 L40.5 42.5 L23.5 42.5 Z" fill="url(#dv-glass)" stroke="#06080d" stroke-width="0.8"/>
  <g fill="#0a0c12" opacity="0.7"><circle cx="21" cy="20" r="0.6"/><circle cx="43" cy="20" r="0.6"/><circle cx="20" cy="31" r="0.6"/><circle cx="44" cy="31" r="0.6"/></g>
</svg>
