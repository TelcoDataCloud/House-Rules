<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 68">
  <!-- DIVER. A yellow space beetle with two claws.
       It stops, flashes, then dives at where you were. -->
  <defs>
    <radialGradient id="glow-orange"><stop offset="0" stop-color="#fff6c0"/><stop offset="0.4" stop-color="#ff9a2a"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="32" cy="8" r="10" fill="url(#glow-orange)"/>
  <!-- claws -->
  <path d="M16 40 C8 46 8 56 14 64 L18 62 C14 56 15 50 20 46 Z" fill="#c9960a" stroke="#3a2a00" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M48 40 C56 46 56 56 50 64 L46 62 C50 56 49 50 44 46 Z" fill="#8a6500" stroke="#3a2a00" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- side wings -->
  <path d="M18 20 L2 30 L4 40 L18 36 Z" fill="#ffd23f" stroke="#3a2a00" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M46 20 L62 30 L60 40 L46 36 Z" fill="#c9960a" stroke="#3a2a00" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- shell -->
  <path d="M32 6 C46 8 50 22 48 38 C46 50 40 58 32 60 C24 58 18 50 16 38 C14 22 18 8 32 6 Z" fill="#ffd23f" stroke="#3a2a00" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 6 C46 8 50 22 48 38 C46 50 40 58 32 60 Z" fill="#c9960a"/>
  <path d="M32 8 L32 58" stroke="#3a2a00" stroke-width="2" opacity="0.7"/>
  <path d="M22 14 C19 22 19 32 21 42 L23 42 C21 32 21 22 24 14 Z" fill="#fff2a8"/>
  <circle cx="25" cy="24" r="3" fill="#3a2a00" opacity="0.4"/>
  <circle cx="39" cy="24" r="3" fill="#3a2a00" opacity="0.4"/>
  <!-- eyes at the front -->
  <circle cx="26" cy="50" r="4.5" fill="#3a2a00"/>
  <circle cx="38" cy="50" r="4.5" fill="#3a2a00"/>
  <circle cx="26" cy="50" r="2.5" fill="#ff3b3b"/>
  <circle cx="38" cy="50" r="2.5" fill="#ff3b3b"/>
  <circle cx="25" cy="49" r="1" fill="#ffffff"/>
  <circle cx="37" cy="49" r="1" fill="#ffffff"/>
</svg>
