<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <!-- THE CORE. The level 1 boss: an armoured battle station.
       Hendrix: every fill is a colour. Change one and watch it.
       The four guns and the reactor in the middle are separate
       pictures (core-turret.svg, core-eye.svg). Under each gun is a
       round mount that is left burnt and empty when you shoot it. -->
  <defs>
    <linearGradient id="co-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9d0de"/><stop offset="0.3" stop-color="#77809a"/><stop offset="0.7" stop-color="#3a4054"/><stop offset="1" stop-color="#161925"/></linearGradient>
    <linearGradient id="co-slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8c94ab"/><stop offset="0.5" stop-color="#454c62"/><stop offset="1" stop-color="#1c2030"/></linearGradient>
    <linearGradient id="co-deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6278"/><stop offset="1" stop-color="#262a3a"/></linearGradient>
    <linearGradient id="co-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfc6d6"/><stop offset="0.5" stop-color="#5d657c"/><stop offset="1" stop-color="#20242f"/></linearGradient>
    <radialGradient id="co-scorch"><stop offset="0" stop-color="#040405"/><stop offset="0.55" stop-color="#1a130c"/><stop offset="0.85" stop-color="#3a2a18"/><stop offset="1" stop-color="#262a34"/></radialGradient>
    <radialGradient id="co-socket"><stop offset="0.7" stop-color="#06070d"/><stop offset="0.9" stop-color="#2a0a1c"/><stop offset="1" stop-color="#5a1038"/></radialGradient>
    <pattern id="co-haz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#15171d"/><rect width="5" height="10" fill="#f0b51c"/></pattern>
  </defs>

  <!-- the main armoured hull -->
  <path d="M78 6 L242 6 L292 38 L314 96 L302 142 L256 208 L64 208 L18 142 L6 96 L28 38 Z" fill="url(#co-hull)" stroke="#0d0f16" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M34 42 L80 12 L170 12 L168 20 L84 20 L42 48 L18 96 L12 96 Z" fill="#ffffff" opacity="0.3"/>

  <!-- heavy side armour slabs -->
  <path d="M30 46 L92 34 L100 150 L46 168 L22 140 L12 96 Z" fill="url(#co-slab)" stroke="#0d0f16" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M290 46 L228 34 L220 150 L274 168 L298 140 L308 96 Z" fill="url(#co-slab)" stroke="#0d0f16" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M34 50 L88 40 L88 46 L38 56 L20 96 L16 96 Z" fill="#ffffff" opacity="0.22"/>
  <path d="M12 96 L100 96 M220 96 L308 96 M58 40 L64 160 M262 40 L256 160" stroke="#0d0f16" stroke-width="1.2" opacity="0.55"/>

  <!-- radiator vents across the top -->
  <path d="M104 8 L216 8 L222 30 L98 30 Z" fill="url(#co-deck)" stroke="#0d0f16" stroke-width="1.6"/>
  <g fill="#0b0d13"><rect x="108" y="12" width="104" height="2.4"/><rect x="106" y="17" width="108" height="2.4"/><rect x="104" y="22" width="112" height="2.4"/></g>
  <g fill="#38f0ff" opacity="0.5"><rect x="112" y="12.6" width="96" height="1"/><rect x="112" y="17.6" width="96" height="1"/></g>
  <!-- antenna spines -->
  <path d="M86 6 L82 -2 M234 6 L238 -2" stroke="#9aa2b8" stroke-width="2"/>

  <!-- the lower hangar bay between the bottom guns -->
  <path d="M136 152 L184 152 L192 206 L128 206 Z" fill="url(#co-deck)" stroke="#0d0f16" stroke-width="1.8"/>
  <rect x="140" y="160" width="40" height="34" fill="#0b0d13" stroke="#0d0f16" stroke-width="1.2"/>
  <path d="M160 160 L160 194" stroke="#38f0ff" stroke-width="1.6" opacity="0.8"/>
  <path d="M142 170 L178 170 M142 180 L178 180" stroke="#2a3042" stroke-width="1.2"/>
  <rect x="130" y="198" width="60" height="7" fill="url(#co-haz)" stroke="#0d0f16" stroke-width="1"/>

  <!-- hazard plates on the corners -->
  <path d="M28 38 L52 26 L56 36 L34 48 Z" fill="url(#co-haz)" stroke="#0d0f16" stroke-width="1"/>
  <path d="M292 38 L268 26 L264 36 L286 48 Z" fill="url(#co-haz)" stroke="#0d0f16" stroke-width="1"/>
  <path d="M64 208 L84 190 L96 190 L82 208 Z M256 208 L236 190 L224 190 L238 208 Z" fill="url(#co-haz)" stroke="#0d0f16" stroke-width="1"/>

  <!-- glowing sensor strips -->
  <g fill="#38f0ff"><rect x="10" y="90" width="3" height="12"/><rect x="307" y="90" width="3" height="12"/><rect x="106" y="40" width="16" height="3"/><rect x="198" y="40" width="16" height="3"/></g>
  <g fill="#0d0f16" opacity="0.7">
    <circle cx="40" cy="60" r="1.6"/><circle cx="280" cy="60" r="1.6"/><circle cx="40" cy="130" r="1.6"/><circle cx="280" cy="130" r="1.6"/>
    <circle cx="96" cy="44" r="1.6"/><circle cx="224" cy="44" r="1.6"/><circle cx="96" cy="140" r="1.6"/><circle cx="224" cy="140" r="1.6"/>
    <circle cx="120" cy="200" r="1.6"/><circle cx="200" cy="200" r="1.6"/>
  </g>

  <!-- the reactor socket: the core sits in here -->
  <circle cx="160" cy="90" r="60" fill="url(#co-plate)" stroke="#0d0f16" stroke-width="2.4"/>
  <circle cx="160" cy="90" r="55" fill="url(#co-haz)" stroke="#0d0f16" stroke-width="1.4"/>
  <circle cx="160" cy="90" r="50" fill="url(#co-socket)" stroke="#0d0f16" stroke-width="2"/>
  <g fill="#2c3242" stroke="#0d0f16" stroke-width="1.2">
    <rect x="154" y="28" width="12" height="9"/><rect x="154" y="143" width="12" height="9"/>
    <rect x="98" y="84" width="9" height="12"/><rect x="213" y="84" width="9" height="12"/>
  </g>

  <!-- gun mounts (the turrets sit on top of these) -->
  <g transform="translate(42 96)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#co-plate)" stroke="#0d0f16" stroke-width="2"/>
    <circle r="15" fill="url(#co-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4cad8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(278 96)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#co-plate)" stroke="#0d0f16" stroke-width="2"/>
    <circle r="15" fill="url(#co-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4cad8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(110 172)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#co-plate)" stroke="#0d0f16" stroke-width="2"/>
    <circle r="15" fill="url(#co-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4cad8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(210 172)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#co-plate)" stroke="#0d0f16" stroke-width="2"/>
    <circle r="15" fill="url(#co-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4cad8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
</svg>
