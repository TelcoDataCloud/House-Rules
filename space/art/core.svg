    <linearGradient id="co-plate" x1="0" x2="1"><stop offset="0" stop-color="#6a7090"/><stop offset="1" stop-color="#2a2e44"/></linearGradient>
    <radialGradient id="co-socket" cx="0.5" cy="0.5"><stop offset="0.6" stop-color="#0d1226"/><stop offset="1" stop-color="#3b4058"/></radialGradient>
  </defs>
  <path d="M40 30 L120 10 L200 10 L280 30 L300 90 L280 150 L200 170 L120 170 L40 150 L20 90 Z" fill="url(#co-hull)" stroke="#1a1d2e" stroke-width="3.5" stroke-linejoin="round"/>
