<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60">
  <!-- RED FLOCK fighter. Small, red, with forward swept wings.
       Get all five in a flock for a prize. Its nose points down at you.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="rd-hull" gradientUnits="userSpaceOnUse" x1="8" y1="6" x2="48" y2="56"><stop offset="0" stop-color="#cfc6c6"/><stop offset="0.35" stop-color="#746868"/><stop offset="0.7" stop-color="#352d2e"/><stop offset="1" stop-color="#181314"/></linearGradient>
    <linearGradient id="rd-wing" gradientUnits="userSpaceOnUse" x1="2" y1="16" x2="54" y2="46"><stop offset="0" stop-color="#a09494"/><stop offset="0.45" stop-color="#4e4445"/><stop offset="1" stop-color="#1c1718"/></linearGradient>
    <radialGradient id="rd-fire" cy="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ffc0a0"/><stop offset="0.6" stop-color="#ff3b3b"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <linearGradient id="rd-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0505"/><stop offset="0.5" stop-color="#ff3b3b"/><stop offset="1" stop-color="#ffd0c0"/></linearGradient>
    <linearGradient id="rd-gun" x1="0" x2="1"><stop offset="0" stop-color="#d6dbe4"/><stop offset="1" stop-color="#2a2e38"/></linearGradient>
  </defs>
  <!-- engine flame -->
  <ellipse cx="28" cy="6" rx="5" ry="7" fill="url(#rd-fire)"/>
  <!-- forward swept wings, tips point down -->
  <path d="M23 20 L3 38 L4 45 L9 45 L23 32 Z" fill="url(#rd-wing)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M33 20 L53 38 L52 45 L47 45 L33 32 Z" fill="url(#rd-wing)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- red wing panels -->
  <path d="M23 20 L3 38 L4 41 L23 24 Z" fill="#ff3b3b"/>
  <path d="M33 20 L53 38 L52 41 L33 24 Z" fill="#c42020"/>
  <path d="M4 42 L9 42 L9 45 L4 45 Z M52 42 L47 42 L47 45 L52 45 Z" fill="#ff3b3b"/>
  <path d="M21 28 L8 40 M35 28 L48 40" stroke="#06080d" stroke-width="0.8" opacity="0.6"/>
  <!-- wingtip guns -->
  <rect x="5.3" y="40" width="1.7" height="11" fill="url(#rd-gun)" stroke="#06080d" stroke-width="0.6"/>
  <rect x="49" y="40" width="1.7" height="11" fill="url(#rd-gun)" stroke="#06080d" stroke-width="0.6"/>
  <!-- tail fins -->
  <path d="M23 16 L15 8 L18 7 L24 12 Z M33 16 L41 8 L38 7 L32 12 Z" fill="url(#rd-wing)" stroke="#06080d" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- engine nozzle -->
  <path d="M23 9 L33 9 L32.4 15 L23.6 15 Z" fill="#1c2028" stroke="#06080d" stroke-width="1.2"/>
  <rect x="24.5" y="9.6" width="7" height="1.6" fill="#ff9a8a"/>
  <!-- body -->
  <path d="M28 58 L24 47 L22.5 30 L22 13 L34 13 L33.5 30 L32 47 Z" fill="url(#rd-hull)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M28 56 L24.8 46.5 L23.4 30 L23 14.5 L28 14.5 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M28 56 L31.2 46.5 L32.6 30 L33 14.5 L28 14.5 Z" fill="#000000" opacity="0.22"/>
  <path d="M22.4 20 L33.6 20 M22.8 34 L33.2 34" stroke="#06080d" stroke-width="0.7" opacity="0.7"/>
  <!-- red nose and gold flock stripe -->
  <path d="M28 58 L25.2 50.5 L30.8 50.5 Z" fill="#ff3b3b" stroke="#06080d" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M22.6 24 L33.4 24 L33.3 26.4 L22.7 26.4 Z" fill="#ffd23f"/>
  <!-- sensor slit canopy -->
  <path d="M28 48 L26.6 42 L26.8 35 L29.2 35 L29.4 42 Z" fill="url(#rd-glass)" stroke="#06080d" stroke-width="0.8"/>
  <g fill="#0a0c12" opacity="0.7"><circle cx="24.5" cy="17" r="0.5"/><circle cx="31.5" cy="17" r="0.5"/><circle cx="24.6" cy="30" r="0.5"/><circle cx="31.4" cy="30" r="0.5"/></g>
</svg>
