<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56">
  <!-- SAUCER. A flying saucer that bounces off the sides.
       Hendrix: every stop-color and fill is a colour you can change. -->
  <defs>
    <linearGradient id="sc-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="0.45" stop-color="#8a9ac4"/><stop offset="1" stop-color="#26304e"/></linearGradient>
    <radialGradient id="sc-dome" cx="0.4" cy="0.35"><stop offset="0" stop-color="#e6feff"/><stop offset="0.45" stop-color="#38f0ff"/><stop offset="1" stop-color="#0a4a5e"/></radialGradient>
    <radialGradient id="sc-glow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#9ff6ff"/><stop offset="1" stop-color="#38f0ff" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="32" cy="44" rx="18" ry="8" fill="url(#sc-glow)"/>
  <ellipse cx="32" cy="32" rx="30" ry="12" fill="url(#sc-rim)" stroke="#121a30" stroke-width="2.2"/>
  <ellipse cx="32" cy="29" rx="26" ry="6" fill="#ffffff" opacity="0.3"/>
  <path d="M6 33 Q32 42 58 33" stroke="#121a30" stroke-width="1.2" fill="none" opacity="0.6"/>
  <g fill="#ffd23f"><circle cx="12" cy="34" r="2.4"/><circle cx="22" cy="37" r="2.4"/><circle cx="32" cy="38" r="2.4"/><circle cx="42" cy="37" r="2.4"/><circle cx="52" cy="34" r="2.4"/></g>
  <path d="M16 28 C16 14 48 14 48 28 Z" fill="url(#sc-dome)" stroke="#121a30" stroke-width="2"/>
  <ellipse cx="26" cy="20" rx="4" ry="2.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="32" cy="24" r="4" fill="#0a3f5e" opacity="0.6"/>
</svg>
