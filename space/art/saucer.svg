<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56">
  <!-- SAUCER. Armoured combat drone. Bounces off the sides.
       The glowing laser emitter underneath points down at you.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="sc-hull" gradientUnits="userSpaceOnUse" x1="6" y1="10" x2="58" y2="48"><stop offset="0" stop-color="#c2cad6"/><stop offset="0.35" stop-color="#646e80"/><stop offset="0.7" stop-color="#2b313e"/><stop offset="1" stop-color="#12151c"/></linearGradient>
    <linearGradient id="sc-plate" gradientUnits="userSpaceOnUse" x1="14" y1="12" x2="50" y2="40"><stop offset="0" stop-color="#9aa3b4"/><stop offset="0.5" stop-color="#454c5c"/><stop offset="1" stop-color="#1a1d25"/></linearGradient>
    <radialGradient id="sc-glow"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#b8fbff"/><stop offset="0.6" stop-color="#38f0ff"/><stop offset="1" stop-color="#38f0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sc-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6feff"/><stop offset="0.5" stop-color="#38f0ff"/><stop offset="1" stop-color="#064a5a"/></linearGradient>
  </defs>
  <!-- laser glow under the drone -->
  <ellipse cx="32" cy="48" rx="7" ry="7" fill="url(#sc-glow)"/>
  <!-- thruster glow at the back -->
  <ellipse cx="20" cy="12" rx="4" ry="5" fill="url(#sc-glow)" opacity="0.8"/>
  <ellipse cx="44" cy="12" rx="4" ry="5" fill="url(#sc-glow)" opacity="0.8"/>
  <!-- laser emitter -->
  <path d="M26 38 L38 38 L35 48 L29 48 Z" fill="#1c2028" stroke="#06080d" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M29.5 39 L34.5 39 L33 47 L31 47 Z" fill="#38f0ff"/>
  <rect x="29.4" y="47" width="5.2" height="3" fill="#e6feff" stroke="#06080d" stroke-width="0.7"/>
  <!-- thruster pods -->
  <path d="M16 13 L24 13 L25 20 L15 20 Z M40 13 L48 13 L49 20 L39 20 Z" fill="#1c2028" stroke="#06080d" stroke-width="1.2"/>
  <rect x="17" y="13.6" width="6" height="1.6" fill="#9ff6ff"/>
  <rect x="41" y="13.6" width="6" height="1.6" fill="#9ff6ff"/>
  <!-- armoured disc, flat sided -->
  <path d="M2 30 L9 21 L22 16 L42 16 L55 21 L62 30 L55 38 L42 43 L22 43 L9 38 Z" fill="url(#sc-hull)" stroke="#06080d" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M3.4 30 L9.8 22.4 L22.4 17.6 L32 17.6 L32 30 Z" fill="#ffffff" opacity="0.14"/>
  <path d="M60.6 30 L54.2 37.6 L41.6 41.4 L32 41.4 L32 30 Z" fill="#000000" opacity="0.25"/>
  <!-- cyan rim lights -->
  <path d="M3 30 L9 37.2 L11 36.4 L5.4 30 Z M61 30 L55 37.2 L53 36.4 L58.6 30 Z" fill="#38f0ff"/>
  <path d="M22.5 41.6 L41.5 41.6 L41 40 L23 40 Z" fill="#38f0ff"/>
  <!-- armour segments -->
  <path d="M9 21 L16 30 L9 38 M55 21 L48 30 L55 38 M22 16 L24 23 M42 16 L40 23 M22 43 L24 37 M42 43 L40 37" stroke="#06080d" stroke-width="1" fill="none" opacity="0.75"/>
  <!-- central armoured hub -->
  <path d="M24 23 L40 23 L48 30 L40 37 L24 37 L16 30 Z" fill="url(#sc-plate)" stroke="#06080d" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M24.6 24.4 L32 24.4 L32 30 L17.8 30 Z" fill="#ffffff" opacity="0.14"/>
  <!-- sensor visor slit -->
  <path d="M21 29 L43 29 L41 32.4 L23 32.4 Z" fill="url(#sc-glass)" stroke="#06080d" stroke-width="0.9"/>
  <path d="M23.5 30 L33 30" stroke="#ffffff" stroke-width="0.6" opacity="0.75"/>
  <g fill="#0a0c12" opacity="0.75"><circle cx="26" cy="20" r="0.6"/><circle cx="38" cy="20" r="0.6"/><circle cx="26" cy="40" r="0.6"/><circle cx="38" cy="40" r="0.6"/><circle cx="7" cy="30" r="0.6"/><circle cx="57" cy="30" r="0.6"/></g>
</svg>
