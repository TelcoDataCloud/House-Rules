<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60">
  <!-- DART. Fast orange interceptor. Its nose points down at you.
       The hot engines are at the top, the two guns poke out at the bottom.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="dt-hull" gradientUnits="userSpaceOnUse" x1="8" y1="6" x2="48" y2="56"><stop offset="0" stop-color="#c3cad8"/><stop offset="0.35" stop-color="#6a7284"/><stop offset="0.7" stop-color="#2e3340"/><stop offset="1" stop-color="#14171e"/></linearGradient>
    <linearGradient id="dt-wing" gradientUnits="userSpaceOnUse" x1="2" y1="14" x2="54" y2="40"><stop offset="0" stop-color="#8a92a4"/><stop offset="0.45" stop-color="#454c5c"/><stop offset="1" stop-color="#1a1d25"/></linearGradient>
    <radialGradient id="dt-fire" cy="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ffd08a"/><stop offset="0.6" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="dt-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1400"/><stop offset="0.5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffe2b0"/></linearGradient>
    <linearGradient id="dt-gun" x1="0" x2="1"><stop offset="0" stop-color="#d6dbe4"/><stop offset="1" stop-color="#2a2e38"/></linearGradient>
  </defs>
  <!-- engine flames -->
  <ellipse cx="23" cy="5" rx="3.6" ry="6" fill="url(#dt-fire)"/>
  <ellipse cx="33" cy="5" rx="3.6" ry="6" fill="url(#dt-fire)"/>
  <!-- swept back wings -->
  <path d="M23 37 L2 23 L3 15 L8 15 L23 21 Z" fill="url(#dt-wing)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M33 37 L54 23 L53 15 L48 15 L33 21 Z" fill="url(#dt-wing)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- orange leading edges -->
  <path d="M23 37 L2 23 L2.3 20.6 L23 33.8 Z" fill="#ff7a1a"/>
  <path d="M33 37 L54 23 L53.7 20.6 L33 33.8 Z" fill="#d85e08"/>
  <path d="M20 27 L6 19 M36 27 L50 19" stroke="#06080d" stroke-width="0.8" opacity="0.6"/>
  <path d="M9 17 L12 17 L10 22 L7 22 Z M47 17 L44 17 L46 22 L49 22 Z" fill="#ff7a1a" opacity="0.9"/>
  <!-- guns -->
  <rect x="18.6" y="30" width="2" height="16" fill="url(#dt-gun)" stroke="#06080d" stroke-width="0.6"/>
  <rect x="35.4" y="30" width="2" height="16" fill="url(#dt-gun)" stroke="#06080d" stroke-width="0.6"/>
  <!-- engine nozzles -->
  <path d="M19 8 L27 8 L26.5 15 L19.5 15 Z M29 8 L37 8 L36.5 15 L29.5 15 Z" fill="#1c2028" stroke="#06080d" stroke-width="1.2"/>
  <rect x="20.5" y="8.6" width="5" height="1.6" fill="#ffb060"/>
  <rect x="30.5" y="8.6" width="5" height="1.6" fill="#ffb060"/>
  <!-- body -->
  <path d="M28 58 L23.5 46 L21.5 30 L21 13 L35 13 L34.5 30 L32.5 46 Z" fill="url(#dt-hull)" stroke="#06080d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M28 56 L24.2 45.5 L22.4 30 L22 14.5 L28 14.5 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M28 56 L31.8 45.5 L33.6 30 L34 14.5 L28 14.5 Z" fill="#000000" opacity="0.22"/>
  <!-- intakes -->
  <path d="M21.5 22 L18 24 L18 31 L21.8 30 Z M34.5 22 L38 24 L38 31 L34.2 30 Z" fill="#20242d" stroke="#06080d" stroke-width="1"/>
  <path d="M22 19 L34 19 M22.3 26 L33.7 26 M23.6 41 L32.4 41" stroke="#06080d" stroke-width="0.7" opacity="0.7"/>
  <path d="M28 14 L28 31" stroke="#06080d" stroke-width="0.6" opacity="0.5"/>
  <!-- orange squadron stripe -->
  <path d="M22.2 21.2 L33.8 21.2 L33.7 23.4 L22.3 23.4 Z" fill="#ff7a1a"/>
  <!-- sensor slit canopy -->
  <path d="M28 50 L26.3 43 L26.6 33 L29.4 33 L29.7 43 Z" fill="url(#dt-glass)" stroke="#06080d" stroke-width="0.8"/>
  <path d="M27.2 35 L27.4 43" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
  <g fill="#0a0c12" opacity="0.7"><circle cx="24" cy="17" r="0.5"/><circle cx="32" cy="17" r="0.5"/><circle cx="24.5" cy="37" r="0.5"/><circle cx="31.5" cy="37" r="0.5"/></g>
</svg>
