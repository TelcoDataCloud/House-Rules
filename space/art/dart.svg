<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60">
  <!-- DART. Small orange fighter. Its nose points down at you.
       Hendrix: every fill="#......" is a colour. Change one and refresh. -->
  <defs>
    <radialGradient id="glow-orange"><stop offset="0" stop-color="#fff6c0"/><stop offset="0.4" stop-color="#ff9a2a"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- engine glow at the back (the top) -->
  <circle cx="21" cy="6" r="7" fill="url(#glow-orange)"/>
  <circle cx="35" cy="6" r="7" fill="url(#glow-orange)"/>
  <!-- wings -->
  <path d="M24 18 L3 30 L4 38 L24 34 Z" fill="#ff7a1a" stroke="#2a0f05" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 18 L53 30 L52 38 L32 34 Z" fill="#b84c0a" stroke="#2a0f05" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M22 22 L8 30 L8 33 L22 30 Z" fill="#ffb070"/>
  <circle cx="5" cy="34" r="2.5" fill="#ff3b3b"/>
  <circle cx="51" cy="34" r="2.5" fill="#ff3b3b"/>
  <!-- engines -->
  <rect x="17" y="6" width="8" height="12" rx="2" fill="#3a1a08" stroke="#2a0f05" stroke-width="2"/>
  <rect x="31" y="6" width="8" height="12" rx="2" fill="#3a1a08" stroke="#2a0f05" stroke-width="2"/>
  <!-- body: main colour, shadow side, bright stripe -->
  <path d="M28 57 C34 46 36 28 34 12 L22 12 C20 28 22 46 28 57 Z" fill="#ff8f3a" stroke="#2a0f05" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 57 C34 46 36 28 34 12 L29 12 C30 30 30 46 28 57 Z" fill="#c45a12"/>
  <path d="M24 16 C23 28 24 40 26 48 L25 48 C22 40 22 28 23 16 Z" fill="#ffd0a0"/>
  <path d="M22 24 L34 24" stroke="#2a0f05" stroke-width="1.5" opacity="0.6"/>
  <!-- cockpit glass near the nose -->
  <ellipse cx="28" cy="40" rx="4.5" ry="7" fill="#4de3ff" stroke="#2a0f05" stroke-width="2"/>
  <ellipse cx="26.5" cy="38" rx="1.5" ry="3" fill="#ffffff"/>
</svg>
