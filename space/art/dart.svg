    <linearGradient id="dt-wing-r" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4520c"/><stop offset="1" stop-color="#4e1c03"/></linearGradient>
    <linearGradient id="dt-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4fcff"/><stop offset="0.45" stop-color="#36c2e6"/><stop offset="1" stop-color="#0a3f5e"/></linearGradient>
    <linearGradient id="dt-metal" x1="0" x2="1"><stop offset="0" stop-color="#7a6a60"/><stop offset="1" stop-color="#241812"/></linearGradient>
  </defs>
