<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- THE TESLA COIL. A tall zappy tower that pops up out of the boss.
       We are looking straight down on top of it, so you see the copper
       rings stacked up like a wedding cake, with the glowing ball on
       the very top. The dark smudge to the bottom right is its shadow.
       Hendrix: every fill is a colour. Try a green ball. -->
  <defs>
    <linearGradient id="wte-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd5e0"/><stop offset="0.35" stop-color="#727a8c"/><stop offset="0.75" stop-color="#343946"/><stop offset="1" stop-color="#121419"/></linearGradient>
    <linearGradient id="wte-copper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd9a0"/><stop offset="0.35" stop-color="#d9873a"/><stop offset="0.7" stop-color="#8a4414"/><stop offset="1" stop-color="#3a1a06"/></linearGradient>
    <radialGradient id="wte-glow"><stop offset="0" stop-color="#b05cff" stop-opacity="0.85"/><stop offset="0.5" stop-color="#b05cff" stop-opacity="0.35"/><stop offset="1" stop-color="#b05cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="wte-orb" cx="0.4" cy="0.38"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#f0d8ff"/><stop offset="0.75" stop-color="#c47cff"/><stop offset="1" stop-color="#7a2ad0"/></radialGradient>
    <pattern id="wte-haz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#14161b"/><rect width="2.5" height="5" fill="#f0b51c"/></pattern>
  </defs>

  <!-- the long shadow of the tower -->
  <path d="M36 22 L58 44 L58 58 L44 58 L22 36 Z" fill="#000000" opacity="0.3"/>
  <circle cx="34" cy="34" r="24" fill="#000000" opacity="0.3"/>

  <!-- the armoured base with a hazard ring -->
  <circle cx="30" cy="30" r="25" fill="url(#wte-haz)" stroke="#0c0d12" stroke-width="2"/>
  <circle cx="30" cy="30" r="21.5" fill="url(#wte-base)" stroke="#0c0d12" stroke-width="1.8"/>
  <path d="M13 24 A18 18 0 0 1 26 11.5" stroke="#ffffff" stroke-width="1.6" fill="none" opacity="0.45"/>
  <g fill="#c4cad8" stroke="#0c0d12" stroke-width="0.5"><circle cx="30" cy="10.5" r="1.3"/><circle cx="49.5" cy="30" r="1.3"/><circle cx="30" cy="49.5" r="1.3"/><circle cx="10.5" cy="30" r="1.3"/></g>
  <g stroke="#0c0d12" stroke-width="1" opacity="0.6"><path d="M16 16 L19 19 M44 16 L41 19 M44 44 L41 41 M16 44 L19 41"/></g>

  <!-- copper coil rings, getting smaller as they go up -->
  <circle cx="31.8" cy="31.8" r="17" fill="#000000" opacity="0.45"/>
  <circle cx="30" cy="30" r="17" fill="url(#wte-copper)" stroke="#2a1204" stroke-width="1.3"/>
  <circle cx="30" cy="30" r="14.8" fill="none" stroke="#3a1a06" stroke-width="0.8" opacity="0.7"/>
  <path d="M16.4 24.1 A16 16 0 0 1 26.6 15.6" stroke="#ffe0b0" stroke-width="1.3" fill="none" opacity="0.75"/>
  <circle cx="31.8" cy="31.8" r="13.5" fill="#000000" opacity="0.45"/>
  <circle cx="30" cy="30" r="13.5" fill="url(#wte-copper)" stroke="#2a1204" stroke-width="1.3"/>
  <circle cx="30" cy="30" r="11.3" fill="none" stroke="#3a1a06" stroke-width="0.8" opacity="0.7"/>
  <path d="M19.2 25.3 A12.5 12.5 0 0 1 27.3 18.5" stroke="#ffe0b0" stroke-width="1.3" fill="none" opacity="0.75"/>
  <circle cx="31.8" cy="31.8" r="10.5" fill="#000000" opacity="0.45"/>
  <circle cx="30" cy="30" r="10.5" fill="url(#wte-copper)" stroke="#2a1204" stroke-width="1.3"/>
  <circle cx="30" cy="30" r="8.3" fill="none" stroke="#3a1a06" stroke-width="0.8" opacity="0.7"/>
  <path d="M21.6 26.3 A9.5 9.5 0 0 1 27.9 21.1" stroke="#ffe0b0" stroke-width="1.3" fill="none" opacity="0.75"/>

  <!-- the glowing ball on top -->
  <circle cx="30" cy="30" r="14" fill="url(#wte-glow)"/>
  <circle cx="30" cy="30" r="6.5" fill="url(#wte-orb)" stroke="#5a1aa0" stroke-width="0.8"/>
  <circle cx="28" cy="27.8" r="2" fill="#ffffff"/>
  <!-- little sparks -->
  <path d="M30 19 L31 22.5 L29.5 23 M41 30 L37.5 31 L37 29.5 M30 41 L29 37.5 L30.5 37 M19 30 L22.5 29 L23 30.5" stroke="#f0d8ff" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
