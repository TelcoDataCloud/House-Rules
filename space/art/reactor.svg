  <path d="M28 5 L130 5 L152 27 L152 121 L130 143 L28 143 L6 121 L6 27 Z" fill="none" stroke="#3a3c3a" stroke-width="4" transform="translate(0 0)" opacity="0.6" stroke-linejoin="round"/>
