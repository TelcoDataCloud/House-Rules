<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150">
  <!-- REACTOR. The big power plant at the end of the big base.
       The pink core glows in the middle, the four round towers cool
       it down. Blow it up and the WHOLE base goes.
       Hendrix: every fill is a colour. Try changing the core! -->
  <defs>
    <filter id="rc-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <linearGradient id="rc-yard" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="152" y2="146"><stop offset="0" stop-color="#8e908a"/><stop offset="0.5" stop-color="#5e605c"/><stop offset="1" stop-color="#323432"/></linearGradient>
    <radialGradient id="rc-tower" cx="0.36" cy="0.34" r="0.75"><stop offset="0" stop-color="#d4d6ce"/><stop offset="0.45" stop-color="#8a8c86"/><stop offset="1" stop-color="#34363a"/></radialGradient>
    <radialGradient id="rc-throat" cx="0.6" cy="0.62" r="0.7"><stop offset="0" stop-color="#0a0c10"/><stop offset="0.8" stop-color="#22262c"/><stop offset="1" stop-color="#4a4e54"/></radialGradient>
    <radialGradient id="rc-steam" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rc-hull" gradientUnits="userSpaceOnUse" x1="44" y1="39" x2="116" y2="111"><stop offset="0" stop-color="#b0b8c2"/><stop offset="0.4" stop-color="#5a626c"/><stop offset="1" stop-color="#1a1e24"/></linearGradient>
    <linearGradient id="rc-fin" x1="0" x2="1"><stop offset="0" stop-color="#9aa2ac"/><stop offset="1" stop-color="#2a2f36"/></linearGradient>
    <radialGradient id="rc-core"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ffb3dc"/><stop offset="0.65" stop-color="#ff3fa4"/><stop offset="1" stop-color="#6a0a3a"/></radialGradient>
    <radialGradient id="rc-glow"><stop offset="0" stop-color="#ff3fa4" stop-opacity="0.7"/><stop offset="0.6" stop-color="#ff3fa4" stop-opacity="0.2"/><stop offset="1" stop-color="#ff3fa4" stop-opacity="0"/></radialGradient>
    <linearGradient id="rc-pipe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ccd0"/><stop offset="1" stop-color="#3a3f46"/></linearGradient>
  </defs>

