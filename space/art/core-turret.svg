<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 56">
  <!-- One of the Core's four turrets. Points down at you, fires straight down. -->
  <defs>
    <linearGradient id="ct-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa0bd"/><stop offset="0.5" stop-color="#4c5270"/><stop offset="1" stop-color="#1a1d2e"/></linearGradient>
    <radialGradient id="ct-dome" cx="0.35" cy="0.3"><stop offset="0" stop-color="#e0ffe8"/><stop offset="0.4" stop-color="#4dff7c"/><stop offset="1" stop-color="#0a5a24"/></radialGradient>
    <linearGradient id="ct-barrel" x1="0" x2="1"><stop offset="0" stop-color="#b8bdd0"/><stop offset="1" stop-color="#2a2e44"/></linearGradient>
  </defs>
  <rect x="4" y="2" width="36" height="34" rx="8" fill="url(#ct-base)" stroke="#1a1d2e" stroke-width="2.4"/>
  <rect x="8" y="5" width="6" height="28" rx="3" fill="#ffffff" opacity="0.3"/>
  <rect x="18" y="30" width="8" height="24" rx="2" fill="url(#ct-barrel)" stroke="#1a1d2e" stroke-width="2"/>
  <rect x="18" y="50" width="8" height="3" fill="#4dff7c"/>
  <circle cx="22" cy="20" r="10.5" fill="url(#ct-dome)" stroke="#0a3a1a" stroke-width="2"/>
  <ellipse cx="18.5" cy="16" rx="3" ry="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="22" cy="21" r="3.5" fill="#0a3a1a"/>
</svg>
