<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 56">
  <!-- A boss gun turret: an armoured dome with twin barrels pointing
       down at you. Every big boss uses this same picture.
       Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="ct-house" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d5dbe6"/><stop offset="0.35" stop-color="#7a8294"/><stop offset="0.75" stop-color="#3a404e"/><stop offset="1" stop-color="#171a21"/></linearGradient>
    <linearGradient id="ct-barrel" x1="0" x2="1"><stop offset="0" stop-color="#dde1e8"/><stop offset="0.45" stop-color="#6a7180"/><stop offset="1" stop-color="#16181e"/></linearGradient>
    <radialGradient id="ct-muzzle"><stop offset="0" stop-color="#fff6d0"/><stop offset="0.4" stop-color="#ff9a2a"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
    <linearGradient id="ct-eye" x1="0" x2="1"><stop offset="0" stop-color="#ff7a5a"/><stop offset="0.5" stop-color="#ff2a2a"/><stop offset="1" stop-color="#8a0a0a"/></linearGradient>
  </defs>
  <!-- twin barrels -->
  <rect x="13" y="30" width="6.5" height="20" fill="url(#ct-barrel)" stroke="#0e1014" stroke-width="1.4"/>
  <rect x="24.5" y="30" width="6.5" height="20" fill="url(#ct-barrel)" stroke="#0e1014" stroke-width="1.4"/>
  <rect x="11.5" y="46" width="9.5" height="5" rx="1" fill="#2a2e36" stroke="#0e1014" stroke-width="1.2"/>
  <rect x="23" y="46" width="9.5" height="5" rx="1" fill="#2a2e36" stroke="#0e1014" stroke-width="1.2"/>
  <circle cx="16.2" cy="53" r="3.6" fill="url(#ct-muzzle)"/>
  <circle cx="27.8" cy="53" r="3.6" fill="url(#ct-muzzle)"/>
  <!-- the armoured housing -->
  <path d="M14 5 L30 5 L40 15 L40 31 L32 39 L12 39 L4 31 L4 15 Z" fill="url(#ct-house)" stroke="#0e1014" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M15 8 L28 8 L26 12 L13 13 L8 18 L8 28 L6 26 L6 16 Z" fill="#ffffff" opacity="0.35"/>
  <!-- gun shield in front -->
  <path d="M10 30 L34 30 L31 38 L13 38 Z" fill="#2c313c" stroke="#0e1014" stroke-width="1.4"/>
  <!-- sensor slit -->
  <rect x="13" y="19" width="18" height="4" rx="1" fill="#0e1014"/>
  <rect x="14" y="20" width="16" height="2" fill="url(#ct-eye)"/>
  <path d="M4 15 L40 15 M22 5 L22 13" stroke="#0e1014" stroke-width="1" opacity="0.55"/>
  <g fill="#0e1014" opacity="0.7"><circle cx="9" cy="33" r="1"/><circle cx="35" cy="33" r="1"/><circle cx="16" cy="10" r="1"/><circle cx="28" cy="10" r="1"/></g>
</svg>
