<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100">
  <!-- ONE ARMOUR DOOR. Two of these close over the plasma core like a
       clam shell. This is the LEFT door; the game flips it to make the
       right one. The hinges are on the left, the hazard stripes are on
       the edge where the two doors meet in the middle.
       The plate is 50 wide (x 10 to 60) so two doors cover the core;
       the hinges hang out past the edge.
       Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="wd-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8cedb"/><stop offset="0.35" stop-color="#6e7688"/><stop offset="0.75" stop-color="#363b48"/><stop offset="1" stop-color="#16181f"/></linearGradient>
    <linearGradient id="wd-hinge" x1="0" x2="1"><stop offset="0" stop-color="#e2e6ec"/><stop offset="0.5" stop-color="#7a8294"/><stop offset="1" stop-color="#22252e"/></linearGradient>
    <pattern id="wd-haz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#14161b"/><rect width="4" height="8" fill="#f0b51c"/></pattern>
  </defs>

  <!-- the thick armour plate -->
  <path d="M10 1 L60 1 L60 99 L10 99 Q7 99 7 96 L7 4 Q7 1 10 1 Z" fill="url(#wd-plate)" stroke="#0c0d12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M11 4 L46 4 L44 7 L13 7 L10 10 L10 60 L9 58 L9 6 Z" fill="#ffffff" opacity="0.35"/>
  <!-- raised middle panel -->
  <path d="M16 14 L44 14 L44 86 L16 86 Z" fill="#3a404e" stroke="#0c0d12" stroke-width="1.3"/>
  <path d="M16 14 L44 14 L42 16 L18 16 L18 84 L16 86 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M16 38 L44 38 M16 62 L44 62 M30 14 L30 38 M30 62 L30 86" stroke="#0c0d12" stroke-width="1" opacity="0.6"/>
  <!-- small warning light -->
  <rect x="23" y="46" width="14" height="8" rx="1.5" fill="#0c0d12"/>
  <rect x="25" y="48" width="10" height="4" fill="#b05cff"/>
  <!-- hazard stripes where the two doors meet -->
  <rect x="47" y="1" width="12" height="98" fill="url(#wd-haz)" stroke="#0c0d12" stroke-width="1.2"/>
  <rect x="58" y="1" width="2" height="98" fill="#0c0d12"/>
  <!-- rivets -->
  <g fill="#c4cad8"><circle cx="13" cy="8" r="1.2"/><circle cx="42" cy="8" r="1.2"/><circle cx="13" cy="92" r="1.2"/><circle cx="42" cy="92" r="1.2"/><circle cx="13" cy="50" r="1.2"/></g>
  <!-- hinges on the outer edge -->
  <g stroke="#0c0d12" stroke-width="1.3">
    <rect x="1" y="12" width="12" height="16" rx="3" fill="url(#wd-hinge)"/>
    <rect x="1" y="72" width="12" height="16" rx="3" fill="url(#wd-hinge)"/>
  </g>
  <path d="M7 12 L7 28 M7 72 L7 88" stroke="#0c0d12" stroke-width="1.2"/>
  <g fill="#0c0d12"><circle cx="4" cy="20" r="1.1"/><circle cx="4" cy="80" r="1.1"/></g>
</svg>
