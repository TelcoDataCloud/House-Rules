<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72">
  <!-- ROBOT TANK. Just the body and the tracks. The gun on top is a
       separate picture (tank-turret.svg) so it can spin round and aim
       at you. The engine is at the top, the front is at the bottom.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="tk-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8bfcc"/><stop offset="0.35" stop-color="#626a7a"/><stop offset="0.75" stop-color="#2c313c"/><stop offset="1" stop-color="#12141a"/></linearGradient>
    <linearGradient id="tk-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e95a4"/><stop offset="0.5" stop-color="#3c424e"/><stop offset="1" stop-color="#16181e"/></linearGradient>
    <linearGradient id="tk-track" x1="0" x2="1"><stop offset="0" stop-color="#3a3e46"/><stop offset="0.5" stop-color="#22252b"/><stop offset="1" stop-color="#0e1013"/></linearGradient>
    <pattern id="tk-tread" width="14" height="5" patternUnits="userSpaceOnUse"><rect width="14" height="5" fill="#1a1c21"/><rect y="0.6" width="14" height="2.6" fill="#4a4f5a"/><rect y="0.6" width="14" height="0.8" fill="#7a808c"/></pattern>
    <pattern id="tk-haz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#14161b"/><rect width="2.5" height="5" fill="#ffb21a"/></pattern>
    <radialGradient id="tk-heat"><stop offset="0" stop-color="#fff1c8"/><stop offset="0.45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- exhaust heat at the back -->
  <ellipse cx="24" cy="5" rx="5" ry="4" fill="url(#tk-heat)"/>
  <ellipse cx="40" cy="5" rx="5" ry="4" fill="url(#tk-heat)"/>
  <!-- the two tracks -->
  <rect x="2" y="4" width="14" height="64" rx="3" fill="url(#tk-track)" stroke="#07080b" stroke-width="1.6"/>
  <rect x="48" y="4" width="14" height="64" rx="3" fill="url(#tk-track)" stroke="#07080b" stroke-width="1.6"/>
  <rect x="3.5" y="6" width="11" height="60" fill="url(#tk-tread)"/>
  <rect x="49.5" y="6" width="11" height="60" fill="url(#tk-tread)"/>
  <path d="M9 6 L9 66 M55 6 L55 66" stroke="#07080b" stroke-width="1.2" opacity="0.7"/>
  <!-- track guards (side skirts) -->
  <path d="M12 12 L18 10 L18 62 L12 60 Z M52 12 L46 10 L46 62 L52 60 Z" fill="url(#tk-plate)" stroke="#07080b" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- the hull -->
  <path d="M18 7 L46 7 L50 13 L50 58 L44 68 L20 68 L14 58 L14 13 Z" fill="url(#tk-hull)" stroke="#07080b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M19 8.6 L32 8.6 L32 10.6 L20 10.6 L16 15 L16 50 L15.6 50 L15.6 13.6 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M46 14 L48.4 14 L48.4 57.6 L43 66.4 L40 66.4 Z" fill="#000000" opacity="0.25"/>
  <!-- engine deck with glowing grilles -->
  <path d="M19 9 L45 9 L47 22 L17 22 Z" fill="#1c1f26" stroke="#07080b" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="#07080b"><rect x="20" y="11" width="10" height="1.8"/><rect x="20" y="14.4" width="10" height="1.8"/><rect x="20" y="17.8" width="10" height="1.8"/><rect x="34" y="11" width="10" height="1.8"/><rect x="34" y="14.4" width="10" height="1.8"/><rect x="34" y="17.8" width="10" height="1.8"/></g>
  <g fill="#ff7a1a" opacity="0.85"><rect x="21" y="11.4" width="8" height="1"/><rect x="21" y="14.8" width="8" height="1"/><rect x="35" y="11.4" width="8" height="1"/><rect x="35" y="14.8" width="8" height="1"/></g>
  <path d="M32 9 L32 22" stroke="#07080b" stroke-width="1"/>
  <!-- the turret ring (the gun sits here) -->
  <circle cx="32" cy="36" r="13.5" fill="url(#tk-plate)" stroke="#07080b" stroke-width="1.6"/>
  <circle cx="32" cy="36" r="10.5" fill="#15171c" stroke="#07080b" stroke-width="1"/>
  <circle cx="32" cy="36" r="10.5" fill="none" stroke="#ff7a1a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7"/>
  <!-- front glacis plate with a hazard band and orange sensor -->
  <path d="M19 52 L45 52 L46 58 L42 65 L22 65 L18 58 Z" fill="url(#tk-plate)" stroke="#07080b" stroke-width="1.3" stroke-linejoin="round"/>
  <rect x="21" y="54" width="22" height="3.6" fill="url(#tk-haz)" stroke="#07080b" stroke-width="0.7"/>
  <rect x="25" y="60" width="14" height="2.6" rx="0.8" fill="#07080b"/>
  <rect x="26" y="60.7" width="12" height="1.2" fill="#ff7a1a"/>
  <g fill="#ffd8a8"><rect x="20.5" y="61" width="2.4" height="1.6"/><rect x="41.1" y="61" width="2.4" height="1.6"/></g>
  <!-- panel lines and rivets -->
  <path d="M14 26 L19 26 M45 26 L50 26 M14 46 L19 46 M45 46 L50 46" stroke="#07080b" stroke-width="0.9" opacity="0.6"/>
  <g fill="#07080b" opacity="0.75"><circle cx="20" cy="25" r="0.8"/><circle cx="44" cy="25" r="0.8"/><circle cx="20" cy="48" r="0.8"/><circle cx="44" cy="48" r="0.8"/><circle cx="16" cy="56" r="0.7"/><circle cx="48" cy="56" r="0.7"/></g>
</svg>
