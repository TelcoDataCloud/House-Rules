<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- FIRE DRONE. A flying attack drone from the volcano level. Its
       black armour does not melt, and the hot cracks and vents glow
       orange and yellow. Its gun points down at you.
       Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="fd-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c625e"/><stop offset="0.35" stop-color="#2e2826"/><stop offset="0.75" stop-color="#161212"/><stop offset="1" stop-color="#070505"/></linearGradient>
    <linearGradient id="fd-wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e4642"/><stop offset="0.5" stop-color="#1e1a19"/><stop offset="1" stop-color="#080606"/></linearGradient>
    <radialGradient id="fd-fire" cy="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ffe9a0"/><stop offset="0.6" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff4a00" stop-opacity="0"/></radialGradient>
    <linearGradient id="fd-lava" x1="0" x2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="0.5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#b8300a"/></linearGradient>
    <radialGradient id="fd-core"><stop offset="0" stop-color="#fffbe0"/><stop offset="0.35" stop-color="#ffd23f"/><stop offset="0.75" stop-color="#ff7a1a"/><stop offset="1" stop-color="#5a1404"/></radialGradient>
  </defs>
  <!-- jet flames at the top -->
  <ellipse cx="21" cy="6" rx="5" ry="6" fill="url(#fd-fire)"/>
  <ellipse cx="35" cy="6" rx="5" ry="6" fill="url(#fd-fire)"/>
  <!-- swept wing blades -->
  <path d="M20 22 L4 12 L2 30 L8 40 L20 38 Z" fill="url(#fd-wing)" stroke="#040303" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M36 22 L52 12 L54 30 L48 40 L36 38 Z" fill="url(#fd-wing)" stroke="#040303" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M4.4 14 L18 22.6 L18 24.6 L4.2 16.4 Z" fill="#ffffff" opacity="0.18"/>
  <!-- glowing cracks across the wings -->
  <path d="M5 22 L9 25 L8 30 L12 33 M47 20 L50 25 L46 29 L49 34" stroke="url(#fd-lava)" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
  <path d="M3 30 L8 40 L20 38 M53 30 L48 40 L36 38" stroke="#ff7a1a" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
  <!-- the wing tip vents -->
  <g fill="#040303"><rect x="5" y="31.5" width="9" height="1.4" transform="rotate(12 9 32)"/><rect x="42" y="31.5" width="9" height="1.4" transform="rotate(-12 47 32)"/></g>
  <!-- the gun -->
  <rect x="25.8" y="38" width="4.4" height="14" fill="#5a524e" stroke="#040303" stroke-width="1"/>
  <rect x="25" y="47" width="6" height="4" fill="#211c1b" stroke="#040303" stroke-width="0.9"/>
  <circle cx="28" cy="53" r="2.6" fill="url(#fd-core)" opacity="0.9"/>
  <!-- engine block -->
  <path d="M15 8 L41 8 L42 16 L14 16 Z" fill="#1a1615" stroke="#040303" stroke-width="1.4" stroke-linejoin="round"/>
  <g fill="#040303"><circle cx="21" cy="11.6" r="3.6"/><circle cx="35" cy="11.6" r="3.6"/></g>
  <g fill="#ffd23f"><circle cx="21" cy="11.6" r="1.8"/><circle cx="35" cy="11.6" r="1.8"/></g>
  <!-- the armoured body -->
  <path d="M18 14 L38 14 L42 24 L39 38 L32 45 L24 45 L17 38 L14 24 Z" fill="url(#fd-hull)" stroke="#040303" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M19 15.6 L30 15.6 L29 17.4 L20 17.6 L16.2 25 L18 37 L16.6 36 L15.6 24.4 Z" fill="#ffffff" opacity="0.2"/>
  <!-- magma seams in the armour -->
  <path d="M28 14 L27 20 L22 24 M27 20 L33 25 L32 31 M22 24 L20 32 L24 38 M32 31 L36 36" stroke="#2a1006" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
  <path d="M28 14 L27 20 L22 24 M27 20 L33 25 L32 31 M22 24 L20 32 L24 38 M32 31 L36 36" stroke="url(#fd-lava)" stroke-width="1" fill="none" stroke-linejoin="round"/>
  <!-- the hot core in the middle -->
  <path d="M23 28 L33 28 L34 33 L30 37 L26 37 L22 33 Z" fill="#0a0707" stroke="#040303" stroke-width="1"/>
  <circle cx="28" cy="32" r="3.4" fill="url(#fd-core)"/>
  <!-- side heat vents -->
  <g fill="#040303"><rect x="15.6" y="26" width="4" height="1.4"/><rect x="15.4" y="29" width="4" height="1.4"/><rect x="36.4" y="26" width="4" height="1.4"/><rect x="36.6" y="29" width="4" height="1.4"/></g>
  <g fill="#ff7a1a"><rect x="16" y="26.3" width="3" height="0.8"/><rect x="37" y="26.3" width="3" height="0.8"/><rect x="16" y="29.3" width="3" height="0.8" fill="#ffd23f"/><rect x="37" y="29.3" width="3" height="0.8" fill="#ffd23f"/></g>
  <!-- yellow sensor slit at the nose -->
  <path d="M24 40 L32 40 L31 43 L25 43 Z" fill="#040303"/>
  <rect x="25" y="40.8" width="6" height="1.2" fill="#ffd23f"/>
  <g fill="#040303" opacity="0.8"><circle cx="17" cy="21" r="0.7"/><circle cx="39" cy="21" r="0.7"/><circle cx="19" cy="37" r="0.7"/><circle cx="37" cy="37" r="0.7"/></g>
</svg>
