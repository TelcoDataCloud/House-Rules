<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 120">
  <!-- One leg of the Goliath, seen from above. The round hip joint at
       the top goes under the body. The big flat foot with three claws
       is at the bottom. The game slides each leg forward and back so
       the robot looks like it is walking.
       Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="ml-armour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b0b8c6"/><stop offset="0.35" stop-color="#5c6474"/><stop offset="0.75" stop-color="#2a2f3a"/><stop offset="1" stop-color="#101216"/></linearGradient>
    <linearGradient id="ml-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6070"/><stop offset="0.5" stop-color="#2a2e38"/><stop offset="1" stop-color="#0e1014"/></linearGradient>
    <linearGradient id="ml-rod" x1="0" x2="1"><stop offset="0" stop-color="#e2e6ee"/><stop offset="0.5" stop-color="#7a8190"/><stop offset="1" stop-color="#22252c"/></linearGradient>
    <pattern id="ml-haz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#14161b"/><rect width="3" height="6" fill="#ffb21a"/></pattern>
  </defs>
  <!-- the hip joint -->
  <circle cx="35" cy="12" r="11" fill="url(#ml-dark)" stroke="#06070a" stroke-width="2"/>
  <circle cx="35" cy="12" r="5" fill="#16181d" stroke="#ff7a1a" stroke-width="1.2"/>
  <!-- hydraulic rods down the sides -->
  <rect x="17" y="24" width="4" height="56" fill="url(#ml-rod)" stroke="#06070a" stroke-width="1"/>
  <rect x="49" y="24" width="4" height="56" fill="url(#ml-rod)" stroke="#06070a" stroke-width="1"/>
  <!-- the thigh armour -->
  <path d="M24 18 L46 18 L51 26 L48 52 L22 52 L19 26 Z" fill="url(#ml-armour)" stroke="#06070a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M25 19.8 L36 19.8 L35 22 L26 22 L21.6 27 L23.6 48 L22.4 48 L20.4 26.4 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M22 34 L48 34" stroke="#06070a" stroke-width="1" opacity="0.6"/>
  <rect x="29" y="38" width="12" height="2.6" rx="0.6" fill="#06070a"/>
  <rect x="30" y="38.7" width="10" height="1.2" fill="#ff7a1a"/>
  <!-- the knee cap -->
  <path d="M18 50 L52 50 L55 58 L48 66 L22 66 L15 58 Z" fill="url(#ml-armour)" stroke="#06070a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="21" y="55" width="28" height="5" fill="url(#ml-haz)" stroke="#06070a" stroke-width="0.9"/>
  <path d="M19 51.6 L35 51.6 L34 53.4 L20 53.4 L17 58 L16.4 57.6 Z" fill="#ffffff" opacity="0.3"/>
  <!-- the shin -->
  <path d="M25 64 L45 64 L46 86 L24 86 Z" fill="url(#ml-dark)" stroke="#06070a" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="#06070a"><rect x="28" y="70" width="14" height="1.6"/><rect x="28" y="74" width="14" height="1.6"/><rect x="28" y="78" width="14" height="1.6"/></g>
  <!-- the big flat foot with three claws -->
  <path d="M12 106 L8 118 L18 113 L22 106 Z M29 108 L35 119 L41 108 Z M58 106 L62 118 L52 113 L48 106 Z" fill="#20232a" stroke="#06070a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M16 84 L54 84 L64 94 L64 104 L56 110 L14 110 L6 104 L6 94 Z" fill="url(#ml-armour)" stroke="#06070a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M16.6 86 L40 86 L39 88 L17.6 88 L8.4 96 L8.4 103 L7.6 102.6 L7.6 94.6 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M22 98 L22 110 M35 98 L35 110 M48 98 L48 110 M6 98 L64 98" stroke="#06070a" stroke-width="1.1" opacity="0.6"/>
  <!-- the ankle joint -->
  <circle cx="35" cy="88" r="6" fill="#2a2e38" stroke="#06070a" stroke-width="1.4"/>
  <circle cx="35" cy="88" r="2" fill="#ff7a1a"/>
  <g fill="#06070a" opacity="0.8"><circle cx="13" cy="94" r="1"/><circle cx="57" cy="94" r="1"/><circle cx="13" cy="104" r="1"/><circle cx="57" cy="104" r="1"/><circle cx="25" cy="23" r="0.9"/><circle cx="45" cy="23" r="0.9"/></g>
</svg>
