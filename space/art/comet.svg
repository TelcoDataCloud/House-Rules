<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130">
  <!-- THE COMET. Your ship. A stealth starfighter.

       Hendrix: the bits inside <g class="up" ...> are the upgrades.
       data-track says which upgrade, data-level says which step.
       They stay hidden until you pick that upgrade in the game.

       Anything with var(trim) in it uses the trim colour. That colour
       changes when you pick a new gun. Every other fill="#......" is a
       colour you can change yourself. The light comes from the top
       left, so the left side is brighter than the right. -->
  <defs>
    <linearGradient id="cm-hull" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6f9fc"/><stop offset="0.45" stop-color="#c4ccd6"/>
      <stop offset="0.75" stop-color="#8a95a3"/><stop offset="1" stop-color="#55606e"/>
    </linearGradient>
    <linearGradient id="cm-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6573"/><stop offset="0.5" stop-color="#363e4a"/><stop offset="1" stop-color="#1b2028"/>
    </linearGradient>
    <linearGradient id="cm-wingl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6df"/><stop offset="0.6" stop-color="#939eab"/><stop offset="1" stop-color="#626d7b"/>
    </linearGradient>
    <linearGradient id="cm-wingr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a8593"/><stop offset="0.6" stop-color="#535d6a"/><stop offset="1" stop-color="#363f4b"/>
    </linearGradient>
    <linearGradient id="cm-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8f6ff"/><stop offset="0.3" stop-color="#3a8fb4"/><stop offset="1" stop-color="#08202e"/>
    </linearGradient>
    <linearGradient id="cm-gun" x1="0" x2="1">
      <stop offset="0" stop-color="#b9c3cf"/><stop offset="0.5" stop-color="#4a5361"/><stop offset="1" stop-color="#1c222b"/>
    </linearGradient>
    <linearGradient id="cm-pod" x1="0" x2="1">
      <stop offset="0" stop-color="#d4dbe3"/><stop offset="0.5" stop-color="#7d8896"/><stop offset="1" stop-color="#3a424e"/>
    </linearGradient>
    <radialGradient id="cm-glow">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" style="stop-color: var(--trim, #38f0ff)" stop-opacity="0.7"/>
      <stop offset="1" style="stop-color: var(--trim, #38f0ff)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cm-hot">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#fff1b8"/><stop offset="1" stop-color="#ff9a2a"/>
    </radialGradient>
    <radialGradient id="cm-lens"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ff9ad0"/><stop offset="1" stop-color="#c41a78"/></radialGradient>
  </defs>

  <!-- engine glow behind the nozzles -->
  <circle cx="51" cy="116" r="8" fill="url(#cm-glow)"/>
  <circle cx="69" cy="116" r="8" fill="url(#cm-glow)"/>

  <!-- the whole body and wings in one dark shape, with a dark outline -->
  <path d="M60 3 L62.8 11 L65.2 24 L67.6 36 L74 48 L106 80 L112 84 L112 96 L86 96 L79 101 L76 108 L74 114 L64 114 L60 110 L56 114 L46 114 L44 108 L41 101 L34 96 L8 96 L8 84 L14 80 L46 48 L52.4 36 L54.8 24 L57.2 11 Z" fill="url(#cm-base)" stroke="#06090e" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- light wing panels -->
  <path d="M47 52 L17 82 L17 89 L40 89 L52 77 L52 57 Z" fill="url(#cm-wingl)"/>
  <path d="M73 52 L103 82 L103 89 L80 89 L68 77 L68 57 Z" fill="url(#cm-wingr)"/>
  <!-- flaps at the back of the wings -->
  <path d="M12 91 L36 91 L39 94 L12 94 Z M108 91 L84 91 L81 94 L108 94 Z" fill="#232932"/>
  <!-- panel lines -->
  <path d="M40 89 L46 95 M80 89 L74 95 M30 64 L36 70 L36 89 M90 64 L84 70 L84 89 M24 89 L24 94 M96 89 L96 94" stroke="#0c1118" stroke-width="0.9" fill="none" opacity="0.7"/>

  <!-- leading edge light strips (trim colour) -->
  <path d="M45 51.5 L16 80.5 L18.6 82.2 L46.6 54 Z" style="fill: var(--trim, #38f0ff)"/>
  <path d="M75 51.5 L104 80.5 L101.4 82.2 L73.4 54 Z" style="fill: var(--trim, #38f0ff)"/>

  <!-- canted tail fins -->
  <path d="M47 82 L40 100 L35 112 L38.5 113 L45 103 L49 90 Z" fill="url(#cm-wingl)" stroke="#06090e" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M73 82 L80 100 L85 112 L81.5 113 L75 103 L71 90 Z" fill="url(#cm-wingr)" stroke="#06090e" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- UPGRADE: bomb racks under the wings -->
  <g class="up" data-track="bay" data-level="1">
    <path d="M36 65 L38.2 69 L38.2 83 L36 85 L33.8 83 L33.8 69 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1"/>
    <path d="M84 65 L86.2 69 L86.2 83 L84 85 L81.8 83 L81.8 69 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1"/>
    <path d="M36 65 L38.2 69 L33.8 69 Z M84 65 L86.2 69 L81.8 69 Z" fill="#ffd23f"/>
    <path d="M32.5 86 L36 82 L39.5 86 Z M80.5 86 L84 82 L87.5 86 Z" fill="#3a424e" stroke="#06090e" stroke-width="0.8"/>
  </g>
  <g class="up" data-track="bay" data-level="2">
    <path d="M28 70 L30.2 74 L30.2 87 L28 89 L25.8 87 L25.8 74 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1"/>
    <path d="M92 70 L94.2 74 L94.2 87 L92 89 L89.8 87 L89.8 74 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1"/>
    <path d="M28 70 L30.2 74 L25.8 74 Z M92 70 L94.2 74 L89.8 74 Z" fill="#ffd23f"/>
  </g>
  <g class="up" data-track="bay" data-level="3">
    <rect x="33.8" y="75" width="4.4" height="2.4" fill="#ff3b3b"/><rect x="81.8" y="75" width="4.4" height="2.4" fill="#ff3b3b"/>
    <rect x="25.8" y="80" width="4.4" height="2.4" fill="#ff3b3b"/><rect x="89.8" y="80" width="4.4" height="2.4" fill="#ff3b3b"/>
  </g>

  <!-- UPGRADE: homing missile pods -->
  <g class="up" data-track="homing" data-level="1">
    <path d="M17.5 64 L24.5 64 L25.5 86 L16.5 86 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M95.5 64 L102.5 64 L103.5 86 L94.5 86 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M18 64 L19.5 59 L21 64 Z M21 64 L22.5 59 L24 64 Z M96 64 L97.5 59 L99 64 Z M99 64 L100.5 59 L102 64 Z" fill="#ff3fa4" stroke="#2a0a1e" stroke-width="0.7"/>
    <path d="M17 78 L25 78 M95 78 L103 78" stroke="#06090e" stroke-width="0.9"/>
  </g>
  <g class="up" data-track="homing" data-level="2">
    <path d="M10 72 L16 72 L17 92 L9 92 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M104 72 L110 72 L111 92 L103 92 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M10.5 72 L13 67 L15.5 72 Z M104.5 72 L107 67 L109.5 72 Z" fill="#ff3fa4" stroke="#2a0a1e" stroke-width="0.7"/>
  </g>
  <g class="up" data-track="homing" data-level="3">
    <circle cx="21" cy="68" r="2.2" fill="#ff3b3b"/><circle cx="99" cy="68" r="2.2" fill="#ff3b3b"/>
    <circle cx="13" cy="76" r="2" fill="#ff3b3b"/><circle cx="107" cy="76" r="2" fill="#ff3b3b"/>
  </g>

  <!-- UPGRADE: wing guns and wingtip guns -->
  <g class="up" data-track="spread" data-level="2">
    <rect x="30" y="52" width="3" height="22" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1"/>
    <rect x="87" y="52" width="3" height="22" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1"/>
    <path d="M28 66 L35 66 L36 80 L27 80 Z M85 66 L92 66 L93 80 L84 80 Z" fill="url(#cm-hull)" stroke="#06090e" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="30" y="49.5" width="3" height="3" style="fill: var(--trim, #38f0ff)"/>
    <rect x="87" y="49.5" width="3" height="3" style="fill: var(--trim, #38f0ff)"/>
  </g>
  <g class="up" data-track="spread" data-level="3">
    <rect x="8.5" y="66" width="3" height="28" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1"/>
    <rect x="108.5" y="66" width="3" height="28" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1"/>
    <rect x="8.5" y="63.5" width="3" height="3" style="fill: var(--trim, #38f0ff)"/>
    <rect x="108.5" y="63.5" width="3" height="3" style="fill: var(--trim, #38f0ff)"/>
  </g>

  <!-- UPGRADE: extra afterburner engines -->
  <g class="up" data-track="rapid" data-level="2">
    <circle cx="30" cy="111" r="5" fill="url(#cm-glow)"/>
    <circle cx="90" cy="111" r="5" fill="url(#cm-glow)"/>
    <path d="M26.5 88 L33.5 88 L34 108 L26 108 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M86.5 88 L93.5 88 L94 108 L86 108 Z" fill="url(#cm-pod)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="27" y="106" width="6" height="2.4" style="fill: var(--trim, #38f0ff)"/>
    <rect x="87" y="106" width="6" height="2.4" style="fill: var(--trim, #38f0ff)"/>
  </g>

  <!-- the two main engines: their flames come out here -->
  <path d="M45 94 L57 94 L57.6 111 L44.4 111 Z" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M63 94 L75 94 L75.6 111 L62.4 111 Z" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="45" y="110" width="12" height="5" rx="1" fill="#10141a" stroke="#06090e" stroke-width="1"/>
  <rect x="63" y="110" width="12" height="5" rx="1" fill="#10141a" stroke="#06090e" stroke-width="1"/>
  <rect x="46.5" y="111.2" width="9" height="2.6" rx="1" style="fill: var(--trim, #38f0ff)"/>
  <rect x="64.5" y="111.2" width="9" height="2.6" rx="1" style="fill: var(--trim, #38f0ff)"/>

  <!-- UPGRADE: afterburner rings, then big hot nozzles -->
  <g class="up" data-track="rapid" data-level="1">
    <rect x="44.6" y="106" width="12.8" height="2.6" fill="#ff9a2a"/>
    <rect x="62.6" y="106" width="12.8" height="2.6" fill="#ff9a2a"/>
  </g>
  <g class="up" data-track="rapid" data-level="3">
    <path d="M43 108 L59 108 L58 117 L44 117 Z" fill="url(#cm-hot)" stroke="#06090e" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M61 108 L77 108 L76 117 L62 117 Z" fill="url(#cm-hot)" stroke="#06090e" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- the middle of the body: light grey spine -->
  <path d="M60 5 L62.5 12 L64.6 24 L66 38 L66.6 60 L66 84 L64 96 L56 96 L54 84 L53.4 60 L54 38 L55.4 24 L57.5 12 Z" fill="url(#cm-hull)"/>
  <path d="M54 46 L66 46 M53.6 70 L66.4 70 M54.4 86 L65.6 86" stroke="#0c1118" stroke-width="0.9" opacity="0.6"/>
  <!-- air intakes beside the cockpit -->
  <path d="M52.6 40 L50 53 L53.4 55 L55 42 Z" fill="#0b0f15" stroke="#e9eef4" stroke-width="0.7"/>
  <path d="M67.4 40 L70 53 L66.6 55 L65 42 Z" fill="#0b0f15" stroke="#8a95a3" stroke-width="0.7"/>
  <!-- light strip down the back (trim colour) -->
  <rect x="58.8" y="50" width="2.4" height="17" rx="1" style="fill: var(--trim, #38f0ff)"/>
  <rect x="58.8" y="74" width="2.4" height="8" rx="1" style="fill: var(--trim, #38f0ff)"/>
  <!-- nose tip light (trim colour) -->
  <path d="M59 6.5 L61 6.5 L61.8 11 L58.2 11 Z" style="fill: var(--trim, #38f0ff)"/>

  <!-- bright edge where the light catches the left side -->
  <path d="M57.2 11 L54.8 24 L52.4 36 L46 48 L14 80" stroke="#ffffff" stroke-width="1.1" fill="none" opacity="0.85" stroke-linejoin="round"/>
  <path d="M8 84.5 L8 95.5 M112 84.5 L112 95.5" stroke="#dfe6ee" stroke-width="1" opacity="0.8"/>

  <!-- nav lights: red on the left, green on the right, white on the fins -->
  <circle cx="11" cy="89" r="2" fill="#ff3b3b" stroke="#06090e" stroke-width="0.6"/>
  <circle cx="109" cy="89" r="2" fill="#4dff7c" stroke="#06090e" stroke-width="0.6"/>
  <circle cx="37" cy="111" r="1.3" fill="#ffffff"/>
  <circle cx="83" cy="111" r="1.3" fill="#ffffff"/>

  <!-- UPGRADE: twin nose guns -->
  <g class="up" data-track="spread" data-level="1">
    <rect x="50.6" y="26" width="2.8" height="20" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1"/>
    <rect x="66.6" y="26" width="2.8" height="20" fill="url(#cm-gun)" stroke="#06090e" stroke-width="1"/>
    <rect x="50.6" y="23.5" width="2.8" height="3" style="fill: var(--trim, #38f0ff)"/>
    <rect x="66.6" y="23.5" width="2.8" height="3" style="fill: var(--trim, #38f0ff)"/>
  </g>

  <!-- the cockpit: a slim tinted canopy -->
  <path d="M60 17 L62.5 25 L63 37 L60 44 L57 37 L57.5 25 Z" fill="url(#cm-glass)" stroke="#06090e" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M58.7 24 L58.4 35 L59.3 34 L59.5 24 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M57.4 33 L62.6 33" stroke="#06090e" stroke-width="0.8" opacity="0.7"/>

  <!-- UPGRADE: the railgun. Two long rails down the nose with glowing coils. -->
  <g class="up" data-track="rail" data-level="1">
    <rect x="54.4" y="0" width="2.8" height="38" fill="url(#cm-gun)" stroke="#06090e" stroke-width="0.9"/>
    <rect x="62.8" y="0" width="2.8" height="38" fill="url(#cm-gun)" stroke="#06090e" stroke-width="0.9"/>
    <rect x="55" y="4" width="10" height="2" fill="#ffd23f"/>
    <rect x="55" y="10" width="10" height="2" fill="#ffd23f"/>
    <rect x="55" y="16" width="10" height="2" fill="#ffd23f"/>
    <rect x="57.2" y="0" width="5.6" height="2.4" fill="#fff6c0"/>
  </g>

  <!-- UPGRADE: the beam lens on the nose -->
  <g class="up" data-track="beam" data-level="1">
    <circle cx="60" cy="11" r="4" fill="url(#cm-lens)" stroke="#2a0a1e" stroke-width="1.3"/>
  </g>
  <g class="up" data-track="beam" data-level="2">
    <ellipse cx="60" cy="18" rx="6" ry="1.8" fill="none" stroke="#ff8ad0" stroke-width="1.8"/>
    <ellipse cx="60" cy="23" rx="7.2" ry="2" fill="none" stroke="#ff8ad0" stroke-width="1.8"/>
  </g>
  <g class="up" data-track="beam" data-level="3">
    <path d="M53 14 L47 5 M67 14 L73 5" stroke="#3a424e" stroke-width="3" stroke-linecap="round"/>
    <path d="M53 14 L47 5 M67 14 L73 5" stroke="#ff8ad0" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="60" cy="9" r="6.5" fill="url(#cm-lens)" stroke="#2a0a1e" stroke-width="1.4"/>
  </g>
</svg>
