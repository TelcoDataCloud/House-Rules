<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130">
  <!-- THE COMET. Your ship.

       Hendrix: the bits inside <g class="up" ...> are the upgrades.
       data-track says which upgrade, data-level says which step.
       They stay hidden until you pick that upgrade in the game.

       The stripes use the trim colour. That colour changes when
       you pick a Laser upgrade. Every other fill="#......" is a colour
       you can change yourself. -->
  <defs>
    <linearGradient id="cm-hull" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eef8ff"/><stop offset="0.35" stop-color="#a9cbe0"/>
      <stop offset="0.7" stop-color="#557a96"/><stop offset="1" stop-color="#26384a"/>
    </linearGradient>
    <linearGradient id="cm-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c86c4"/><stop offset="0.5" stop-color="#27508a"/><stop offset="1" stop-color="#122649"/>
    </linearGradient>
    <linearGradient id="cm-wing-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5c96"/><stop offset="0.5" stop-color="#1c3d6e"/><stop offset="1" stop-color="#0e1e3c"/>
    </linearGradient>
    <linearGradient id="cm-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4fcff"/><stop offset="0.45" stop-color="#3cc6e8"/><stop offset="1" stop-color="#0a3f5e"/>
    </linearGradient>
    <linearGradient id="cm-gun" x1="0" x2="1">
      <stop offset="0" stop-color="#8d9bb0"/><stop offset="0.5" stop-color="#3c4658"/><stop offset="1" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="cm-pod" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb3dc"/><stop offset="0.45" stop-color="#ff3fa4"/><stop offset="1" stop-color="#8a1050"/>
    </linearGradient>
    <radialGradient id="cm-engine"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#b8fbff"/><stop offset="0.65" stop-color="#38f0ff" stop-opacity="0.6"/><stop offset="1" stop-color="#38f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="cm-lens"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#ff9ad0"/><stop offset="1" stop-color="#c41a78"/></radialGradient>
  </defs>

  <!-- engine glow -->
  <circle cx="50" cy="118" r="10" fill="url(#cm-engine)"/>
  <circle cx="70" cy="118" r="10" fill="url(#cm-engine)"/>

  <!-- tail fins -->
  <path d="M49 94 L38 114 L45 116 L52 104 Z" fill="url(#cm-wing)" stroke="#0a1424" stroke-width="2" stroke-linejoin="round"/>
  <path d="M71 94 L82 114 L75 116 L68 104 Z" fill="url(#cm-wing-r)" stroke="#0a1424" stroke-width="2" stroke-linejoin="round"/>

  <!-- wings -->
  <path d="M50 50 L6 90 L9 101 L48 92 Z" fill="url(#cm-wing)" stroke="#0a1424" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M70 50 L114 90 L111 101 L72 92 Z" fill="url(#cm-wing-r)" stroke="#0a1424" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M47 58 L14 89 L18 91 L47 65 Z" fill="#8fc0f0" opacity="0.55"/>
  <path d="M73 58 L106 89 L103 90 L73 64 Z" fill="#5d8cc4" opacity="0.35"/>
  <path d="M44 70 L22 91 M41 80 L30 92 M76 70 L98 91 M79 80 L90 92" stroke="#0a1424" stroke-width="1.2" opacity="0.5"/>
  <path d="M30 84 L13 97 L17 99 L33 88 Z" style="fill: var(--trim, #38f0ff)"/>
  <path d="M90 84 L107 97 L103 99 L87 88 Z" style="fill: var(--trim, #38f0ff)"/>
  <circle cx="10" cy="97" r="2.6" fill="#ff3b3b"/>
  <circle cx="110" cy="97" r="2.6" fill="#4dff7c"/>

  <!-- UPGRADE: bomb racks under the wings -->
  <g class="up" data-track="bay" data-level="1">
    <ellipse cx="38" cy="86" rx="3.5" ry="7" fill="#ffd23f" stroke="#3a2a00" stroke-width="1.5"/>
    <ellipse cx="82" cy="86" rx="3.5" ry="7" fill="#c9960a" stroke="#3a2a00" stroke-width="1.5"/>
  </g>
  <g class="up" data-track="bay" data-level="2">
    <ellipse cx="31" cy="90" rx="3.5" ry="7" fill="#ffd23f" stroke="#3a2a00" stroke-width="1.5"/>
    <ellipse cx="89" cy="90" rx="3.5" ry="7" fill="#c9960a" stroke="#3a2a00" stroke-width="1.5"/>
  </g>
  <g class="up" data-track="bay" data-level="3">
    <rect x="34" y="80" width="8" height="3" fill="#ff3b3b"/><rect x="78" y="80" width="8" height="3" fill="#ff3b3b"/>
    <rect x="27" y="84" width="8" height="3" fill="#ff3b3b"/><rect x="85" y="84" width="8" height="3" fill="#ff3b3b"/>
  </g>

  <!-- UPGRADE: homing missile pods -->
  <g class="up" data-track="homing" data-level="1">
    <rect x="21" y="68" width="9" height="24" rx="4.5" fill="url(#cm-pod)" stroke="#2a0a1e" stroke-width="2"/>
    <rect x="90" y="68" width="9" height="24" rx="4.5" fill="url(#cm-pod)" stroke="#2a0a1e" stroke-width="2"/>
  </g>
  <g class="up" data-track="homing" data-level="2">
    <rect x="14" y="76" width="8" height="19" rx="4" fill="url(#cm-pod)" stroke="#2a0a1e" stroke-width="2"/>
    <rect x="98" y="76" width="8" height="19" rx="4" fill="url(#cm-pod)" stroke="#2a0a1e" stroke-width="2"/>
  </g>
  <g class="up" data-track="homing" data-level="3">
    <circle cx="25.5" cy="70" r="3.5" fill="#ff3b3b"/><circle cx="94.5" cy="70" r="3.5" fill="#ff3b3b"/>
    <circle cx="18" cy="78" r="3" fill="#ff3b3b"/><circle cx="102" cy="78" r="3" fill="#ff3b3b"/>
  </g>

  <!-- UPGRADE: wing guns and wingtip guns -->
  <g class="up" data-track="spread" data-level="2">
    <rect x="31" y="56" width="5" height="24" rx="2" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.5"/>
    <rect x="84" y="56" width="5" height="24" rx="2" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.5"/>
    <ellipse cx="33.5" cy="78" rx="6" ry="4.5" fill="url(#cm-hull)" stroke="#0a1424" stroke-width="1.5"/>
    <ellipse cx="86.5" cy="78" rx="6" ry="4.5" fill="url(#cm-hull)" stroke="#0a1424" stroke-width="1.5"/>
    <rect x="31" y="54" width="5" height="3" style="fill: var(--trim, #38f0ff)"/>
    <rect x="84" y="54" width="5" height="3" style="fill: var(--trim, #38f0ff)"/>
  </g>
  <g class="up" data-track="spread" data-level="3">
    <rect x="13" y="72" width="5" height="22" rx="2" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.5"/>
    <rect x="102" y="72" width="5" height="22" rx="2" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.5"/>
    <rect x="13" y="70" width="5" height="3" style="fill: var(--trim, #38f0ff)"/>
    <rect x="102" y="70" width="5" height="3" style="fill: var(--trim, #38f0ff)"/>
  </g>

  <!-- engine pods -->
  <rect x="42" y="90" width="15" height="26" rx="5" fill="url(#cm-hull)" stroke="#0a1424" stroke-width="2"/>
  <rect x="63" y="90" width="15" height="26" rx="5" fill="url(#cm-hull)" stroke="#0a1424" stroke-width="2"/>
  <rect x="44" y="112" width="11" height="6" rx="2" fill="#1a2230"/>
  <rect x="65" y="112" width="11" height="6" rx="2" fill="#1a2230"/>

  <!-- UPGRADE: bigger engines -->
  <g class="up" data-track="rapid" data-level="1">
    <rect x="43" y="110" width="13" height="3" fill="#ff9a2a"/>
    <rect x="64" y="110" width="13" height="3" fill="#ff9a2a"/>
  </g>
  <g class="up" data-track="rapid" data-level="2">
    <rect x="35" y="96" width="7" height="18" rx="3" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.5"/>
    <rect x="78" y="96" width="7" height="18" rx="3" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.5"/>
    <circle cx="38.5" cy="118" r="5" fill="url(#cm-engine)"/>
    <circle cx="81.5" cy="118" r="5" fill="url(#cm-engine)"/>
  </g>
  <g class="up" data-track="rapid" data-level="3">
    <rect x="42" y="90" width="15" height="9" rx="4" fill="#ffd23f" stroke="#0a1424" stroke-width="1.5"/>
    <rect x="63" y="90" width="15" height="9" rx="4" fill="#ffd23f" stroke="#0a1424" stroke-width="1.5"/>
  </g>

  <!-- body -->
  <path d="M60 4 C70 18 74 46 74 76 C74 92 70 104 60 108 C50 104 46 92 46 76 C46 46 50 18 60 4 Z" fill="url(#cm-hull)" stroke="#0a1424" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M56 14 C52 30 51 52 51 78 L54 78 C54 52 55 30 58 14 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M48 62 L72 62 M47 84 L73 84" stroke="#0a1424" stroke-width="1.2" opacity="0.45"/>
  <rect x="48" y="54" width="4" height="12" rx="1.5" fill="#1a2230"/>
  <rect x="68" y="54" width="4" height="12" rx="1.5" fill="#1a2230"/>
  <g fill="#0a1424" opacity="0.5"><circle cx="52" cy="70" r="0.9"/><circle cx="68" cy="70" r="0.9"/><circle cx="52" cy="78" r="0.9"/><circle cx="68" cy="78" r="0.9"/><circle cx="55" cy="96" r="0.9"/><circle cx="65" cy="96" r="0.9"/></g>
  <path d="M57.5 8 L62.5 8 L62 17 L58 17 Z" style="fill: var(--trim, #38f0ff)"/>
  <path d="M54 68 L60 75 L66 68" stroke="#ffd23f" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- UPGRADE: twin nose guns -->
  <g class="up" data-track="spread" data-level="1">
    <rect x="48" y="26" width="4" height="20" rx="1.5" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.2"/>
    <rect x="68" y="26" width="4" height="20" rx="1.5" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1.2"/>
    <rect x="48" y="24" width="4" height="3" style="fill: var(--trim, #38f0ff)"/>
    <rect x="68" y="24" width="4" height="3" style="fill: var(--trim, #38f0ff)"/>
  </g>

  <!-- cockpit glass -->
  <path d="M60 24 C66 30 67 40 66 50 L54 50 C53 40 54 30 60 24 Z" fill="url(#cm-glass)" stroke="#0a1424" stroke-width="2"/>
  <path d="M57.5 30 C55.5 34 55.5 40 56 45 L58 45 C57.5 40 57.5 34 59.5 30 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M54 42 L66 42" stroke="#0a1424" stroke-width="1.2" opacity="0.6"/>

  <!-- UPGRADE: the railgun. Two long rails down the nose with glowing coils. -->
  <g class="up" data-track="rail" data-level="1">
    <rect x="54.5" y="0" width="3" height="34" rx="1" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1"/>
    <rect x="62.5" y="0" width="3" height="34" rx="1" fill="url(#cm-gun)" stroke="#0a1424" stroke-width="1"/>
    <rect x="56" y="6" width="8" height="2" fill="#ffd23f"/>
    <rect x="56" y="13" width="8" height="2" fill="#ffd23f"/>
    <rect x="56" y="20" width="8" height="2" fill="#ffd23f"/>
    <rect x="57.5" y="0" width="5" height="3" fill="#fff6c0"/>
  </g>

  <!-- UPGRADE: the beam lens on the nose -->
  <g class="up" data-track="beam" data-level="1">
    <circle cx="60" cy="12" r="4.5" fill="url(#cm-lens)" stroke="#2a0a1e" stroke-width="1.5"/>
  </g>
  <g class="up" data-track="beam" data-level="2">
    <ellipse cx="60" cy="19" rx="7" ry="2" fill="none" stroke="#ff8ad0" stroke-width="2"/>
    <ellipse cx="60" cy="24" rx="8" ry="2.2" fill="none" stroke="#ff8ad0" stroke-width="2"/>
  </g>
  <g class="up" data-track="beam" data-level="3">
    <circle cx="60" cy="10" r="7" fill="url(#cm-lens)" stroke="#2a0a1e" stroke-width="1.5"/>
    <path d="M52 12 L46 6 M68 12 L74 6" stroke="#ff8ad0" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
