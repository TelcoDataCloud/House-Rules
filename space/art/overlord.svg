<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <!-- THE OVERLORD. The last boss: a huge black dreadnought with
       swept-back wings and hot pink engines. Hendrix: every fill is
       a colour. Change one and watch it.
       Its six guns and the reactor in the middle are separate
       pictures (core-turret.svg and core-eye.svg). Under each gun is
       a round mount that is left burnt and empty when you shoot it. -->
  <defs>
    <linearGradient id="ov-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c98b4"/><stop offset="0.3" stop-color="#4a4762"/><stop offset="0.7" stop-color="#22202f"/><stop offset="1" stop-color="#0a0910"/></linearGradient>
    <linearGradient id="ov-wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e6a88"/><stop offset="0.5" stop-color="#2c2a3c"/><stop offset="1" stop-color="#0c0b12"/></linearGradient>
    <linearGradient id="ov-slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c7896"/><stop offset="0.5" stop-color="#363348"/><stop offset="1" stop-color="#121119"/></linearGradient>
    <linearGradient id="ov-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6b2cc"/><stop offset="0.5" stop-color="#4c4862"/><stop offset="1" stop-color="#16141e"/></linearGradient>
    <radialGradient id="ov-scorch"><stop offset="0" stop-color="#040405"/><stop offset="0.55" stop-color="#1a130c"/><stop offset="0.85" stop-color="#3a2a18"/><stop offset="1" stop-color="#22202c"/></radialGradient>
    <radialGradient id="ov-socket"><stop offset="0.7" stop-color="#05040a"/><stop offset="0.9" stop-color="#2a0a1c"/><stop offset="1" stop-color="#6a1044"/></radialGradient>
    <radialGradient id="ov-jet"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#ff9ad0"/><stop offset="1" stop-color="#ff3fa4" stop-opacity="0"/></radialGradient>
    <pattern id="ov-haz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#121118"/><rect width="5" height="10" fill="#f0b51c"/></pattern>
  </defs>

  <!-- engine jets at the back (the top) -->
  <g fill="url(#ov-jet)"><ellipse cx="160" cy="8" rx="18" ry="9"/><ellipse cx="200" cy="6" rx="22" ry="10"/><ellipse cx="240" cy="8" rx="18" ry="9"/></g>

  <!-- the great swept-back wings -->
  <path d="M124 64 L70 30 L2 2 L10 58 L18 116 L2 170 L46 172 L98 218 L134 206 Z" fill="url(#ov-wing)" stroke="#06050a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M276 64 L330 30 L398 2 L390 58 L382 116 L398 170 L354 172 L302 218 L266 206 Z" fill="url(#ov-wing)" stroke="#06050a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 70 L68 38 L10 14 L12 28 L64 50 L120 82 Z" fill="#ffffff" opacity="0.22"/>
  <!-- second layer of wing armour -->
  <path d="M126 96 L70 110 L84 170 L120 196 L134 190 Z" fill="url(#ov-slab)" stroke="#06050a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M274 96 L330 110 L316 170 L280 196 L266 190 Z" fill="url(#ov-slab)" stroke="#06050a" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- glowing pink edges and vents -->
  <path d="M12 60 L20 116 L6 166 M48 170 L96 212" stroke="#ff3fa4" stroke-width="2.4" fill="none"/>
  <path d="M30 40 L48 150 M50 46 L64 120 M30 150 L78 186 M346 150 L322 186" stroke="#06050a" stroke-width="1.2" opacity="0.7"/>
  <path d="M388 60 L380 116 L394 166 M352 170 L304 212" stroke="#ff3fa4" stroke-width="2.4" fill="none"/>
  <path d="M370 40 L352 150 M350 46 L336 120" stroke="#06050a" stroke-width="1.2" opacity="0.7"/>
  <g fill="#ff3fa4"><rect x="92" y="122" width="22" height="3" transform="rotate(14 103 123)"/><rect x="286" y="122" width="22" height="3" transform="rotate(-14 297 123)"/></g>
  <path d="M6 10 L30 20 L30 32 L8 24 Z M394 10 L370 20 L370 32 L392 24 Z" fill="url(#ov-haz)" stroke="#06050a" stroke-width="1"/>
  <path d="M62 34 L70 110 M338 34 L330 110" stroke="#06050a" stroke-width="1.2" opacity="0.7"/>

  <!-- the main hull: a long armoured spearhead -->
  <path d="M156 4 L244 4 L292 36 L310 130 L298 196 L246 248 L154 248 L102 196 L90 130 L108 36 Z" fill="url(#ov-hull)" stroke="#06050a" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M114 40 L158 10 L210 10 L208 18 L162 18 L120 46 L98 130 L94 130 Z" fill="#ffffff" opacity="0.28"/>
  <!-- engine block -->
  <path d="M150 8 L250 8 L258 32 L142 32 Z" fill="url(#ov-slab)" stroke="#06050a" stroke-width="1.6"/>
  <g fill="#06050a"><circle cx="164" cy="20" r="7"/><circle cx="200" cy="20" r="8"/><circle cx="236" cy="20" r="7"/></g>
  <g fill="#ffb3dc"><circle cx="164" cy="20" r="3.6"/><circle cx="200" cy="20" r="4.2"/><circle cx="236" cy="20" r="3.6"/></g>
  <!-- side armour slabs with vents -->
  <path d="M110 44 L136 40 L140 186 L114 196 L96 130 Z" fill="url(#ov-slab)" stroke="#06050a" stroke-width="1.6"/>
  <path d="M290 44 L264 40 L260 186 L286 196 L304 130 Z" fill="url(#ov-slab)" stroke="#06050a" stroke-width="1.6"/>
  <g fill="#06050a"><rect x="114" y="150" width="20" height="2.4"/><rect x="114" y="156" width="20" height="2.4"/><rect x="114" y="162" width="20" height="2.4"/><rect x="266" y="150" width="20" height="2.4"/><rect x="266" y="156" width="20" height="2.4"/><rect x="266" y="162" width="20" height="2.4"/></g>
  <g fill="#ff3fa4" opacity="0.8"><rect x="116" y="150.6" width="16" height="1"/><rect x="116" y="156.6" width="16" height="1"/><rect x="268" y="150.6" width="16" height="1"/><rect x="268" y="156.6" width="16" height="1"/></g>
  <path d="M96 130 L140 130 M260 130 L304 130 M150 180 L250 180" stroke="#06050a" stroke-width="1.2" opacity="0.6"/>
  <!-- the armoured prow -->
  <path d="M172 184 L228 184 L234 230 L200 246 L166 230 Z" fill="url(#ov-slab)" stroke="#06050a" stroke-width="1.6"/>
  <g fill="#ff3fa4"><rect x="180" y="194" width="40" height="4" rx="1"/><rect x="184" y="204" width="32" height="3" rx="1"/></g>
  <rect x="180" y="218" width="40" height="8" fill="url(#ov-haz)" stroke="#06050a" stroke-width="1"/>
  <g fill="#06050a" opacity="0.8">
    <circle cx="120" cy="100" r="1.6"/><circle cx="280" cy="100" r="1.6"/><circle cx="124" cy="176" r="1.6"/><circle cx="276" cy="176" r="1.6"/>
    <circle cx="30" cy="40" r="1.4"/><circle cx="370" cy="40" r="1.4"/>
  </g>

  <!-- the reactor socket -->
  <circle cx="200" cy="110" r="62" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2.4"/>
  <circle cx="200" cy="110" r="56" fill="url(#ov-haz)" stroke="#06050a" stroke-width="1.4"/>
  <circle cx="200" cy="110" r="50" fill="url(#ov-socket)" stroke="#06050a" stroke-width="2"/>
  <g fill="#2a2838" stroke="#06050a" stroke-width="1.2">
    <rect x="194" y="46" width="12" height="9"/><rect x="194" y="165" width="12" height="9"/>
    <rect x="137" y="104" width="9" height="12"/><rect x="254" y="104" width="9" height="12"/>
  </g>
  <g fill="#ff3fa4"><rect x="197" y="48" width="6" height="2"/><rect x="197" y="170" width="6" height="2"/></g>

  <!-- gun mounts (the turrets sit on top of these) -->
  <g transform="translate(40 95)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2"/>
    <circle r="15" fill="url(#ov-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4c0d8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(360 95)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2"/>
    <circle r="15" fill="url(#ov-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4c0d8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(80 175)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2"/>
    <circle r="15" fill="url(#ov-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4c0d8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(320 175)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2"/>
    <circle r="15" fill="url(#ov-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4c0d8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(150 215)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2"/>
    <circle r="15" fill="url(#ov-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4c0d8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
  <g transform="translate(250 215)">
    <path d="M-11 -22 L11 -22 L22 -11 L22 11 L11 22 L-11 22 L-22 11 L-22 -11 Z" fill="url(#ov-plate)" stroke="#06050a" stroke-width="2"/>
    <circle r="15" fill="url(#ov-scorch)" stroke="#06070a" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4c0d8"><circle cx="-17" cy="-6" r="1.3"/><circle cx="17" cy="-6" r="1.3"/><circle cx="-17" cy="6" r="1.3"/><circle cx="17" cy="6" r="1.3"/></g>
  </g>
</svg>
