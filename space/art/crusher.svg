<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 150">
  <!-- THE CRUSHER. The level 4 mini boss: a super heavy robot tank
       with huge twin tracks and a bulldozer blade on the front.
       Its two side guns are separate pictures (crusher-gun.svg). Under
       each gun is an armoured mount that is left burnt when you shoot
       the gun off. The round orange hatch in the middle is its weak
       spot. Hendrix: every fill is a colour. Change one and refresh. -->
  <defs>
    <linearGradient id="cr-hull" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b4bbc8"/><stop offset="0.3" stop-color="#5e6676"/><stop offset="0.7" stop-color="#2a2f3a"/><stop offset="1" stop-color="#0f1116"/></linearGradient>
    <linearGradient id="cr-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa1b0"/><stop offset="0.5" stop-color="#424856"/><stop offset="1" stop-color="#16181e"/></linearGradient>
    <linearGradient id="cr-slab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c7382"/><stop offset="0.5" stop-color="#30353f"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <linearGradient id="cr-track" x1="0" x2="1"><stop offset="0" stop-color="#3c4048"/><stop offset="0.5" stop-color="#23262c"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>
    <linearGradient id="cr-barrel" x1="0" x2="1"><stop offset="0" stop-color="#dde1e8"/><stop offset="0.45" stop-color="#6a7180"/><stop offset="1" stop-color="#16181e"/></linearGradient>
    <pattern id="cr-tread" width="30" height="9" patternUnits="userSpaceOnUse"><rect width="30" height="9" fill="#17191d"/><rect y="1" width="30" height="5" fill="#474c56"/><rect y="1" width="30" height="1.4" fill="#80868f"/><rect x="13" y="1" width="4" height="5" fill="#2a2d33"/></pattern>
    <pattern id="cr-haz" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#14161b"/><rect width="5" height="10" fill="#ffb21a"/></pattern>
    <radialGradient id="cr-scorch"><stop offset="0" stop-color="#040405"/><stop offset="0.55" stop-color="#1a130c"/><stop offset="0.85" stop-color="#3a2a18"/><stop offset="1" stop-color="#22252c"/></radialGradient>
    <radialGradient id="cr-heat"><stop offset="0" stop-color="#fff1c8"/><stop offset="0.4" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="cr-core"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.3" stop-color="#ffc060"/><stop offset="0.7" stop-color="#ff7a1a"/><stop offset="1" stop-color="#6a2004"/></radialGradient>
  </defs>

  <!-- exhaust heat out of the back -->
  <ellipse cx="88" cy="6" rx="12" ry="7" fill="url(#cr-heat)"/>
  <ellipse cx="142" cy="6" rx="12" ry="7" fill="url(#cr-heat)"/>

  <!-- the two huge tracks -->
  <rect x="3" y="8" width="38" height="136" rx="7" fill="url(#cr-track)" stroke="#07080b" stroke-width="2.4"/>
  <rect x="189" y="8" width="38" height="136" rx="7" fill="url(#cr-track)" stroke="#07080b" stroke-width="2.4"/>
  <rect x="7" y="12" width="30" height="128" fill="url(#cr-tread)"/>
  <rect x="193" y="12" width="30" height="128" fill="url(#cr-tread)"/>
  <path d="M7 12 L7 140 M37 12 L37 140 M193 12 L193 140 M223 12 L223 140" stroke="#07080b" stroke-width="1.4"/>

  <!-- the hull -->
  <path d="M52 10 L178 10 L196 24 L199 118 L186 136 L44 136 L31 118 L34 24 Z" fill="url(#cr-hull)" stroke="#07080b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M53 12.6 L120 12.6 L120 16 L56 16 L38 28 L35.6 100 L33.6 100 L36.4 25.4 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M192 26 L196 26 L196.6 117 L184.4 133.4 L178 133.4 L192 114 Z" fill="#000000" opacity="0.28"/>

  <!-- track guards: long armour skirts over the inside of each track -->
  <path d="M30 20 L46 16 L46 132 L30 128 Z" fill="url(#cr-slab)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M200 20 L184 16 L184 132 L200 128 Z" fill="url(#cr-slab)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M30 42 L46 42 M30 104 L46 104 M184 42 L200 42 M184 104 L200 104" stroke="#07080b" stroke-width="1.1" opacity="0.7"/>
  <g fill="#ff7a1a"><rect x="33" y="24" width="2.4" height="12"/><rect x="194.6" y="24" width="2.4" height="12"/></g>

  <!-- engine deck at the back with glowing grilles and two stacks -->
  <path d="M60 14 L170 14 L176 40 L54 40 Z" fill="#1b1e24" stroke="#07080b" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="#07080b">
    <rect x="98" y="18" width="34" height="2.4"/><rect x="98" y="23" width="34" height="2.4"/><rect x="98" y="28" width="34" height="2.4"/><rect x="98" y="33" width="34" height="2.4"/>
  </g>
  <g fill="#ff7a1a" opacity="0.85"><rect x="100" y="18.6" width="30" height="1.1"/><rect x="100" y="23.6" width="30" height="1.1"/><rect x="100" y="28.6" width="30" height="1.1"/></g>
  <g fill="#2c3038" stroke="#07080b" stroke-width="1.6"><circle cx="78" cy="26" r="10"/><circle cx="152" cy="26" r="10"/></g>
  <g fill="#07080b"><circle cx="78" cy="26" r="6.4"/><circle cx="152" cy="26" r="6.4"/></g>
  <g fill="#ff7a1a"><circle cx="78" cy="26" r="3.2"/><circle cx="152" cy="26" r="3.2"/></g>
  <g fill="#ffe0a8"><circle cx="78" cy="26" r="1.4"/><circle cx="152" cy="26" r="1.4"/></g>
  <path d="M92 14 L91 40 M139 14 L140 40" stroke="#07080b" stroke-width="1.2"/>

  <!-- upper deck armour either side of the hatch -->
  <path d="M74 44 L96 44 L94 96 L72 100 Z" fill="url(#cr-plate)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M156 44 L134 44 L136 96 L158 100 Z" fill="url(#cr-plate)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M75.6 45.6 L94.2 45.6 L94 48 L77.6 48 L75 92 L73.8 92 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M73 64 L95 64 M73 82 L95 82 M135 64 L157 64 M135 82 L157 82" stroke="#07080b" stroke-width="1" opacity="0.6"/>
  <g fill="#07080b"><rect x="78" y="68" width="12" height="1.6"/><rect x="78" y="72" width="12" height="1.6"/><rect x="78" y="76" width="12" height="1.6"/><rect x="140" y="68" width="12" height="1.6"/><rect x="140" y="72" width="12" height="1.6"/><rect x="140" y="76" width="12" height="1.6"/></g>

  <!-- the weak core hatch at (115, 67) -->
  <circle cx="115" cy="67" r="25" fill="url(#cr-slab)" stroke="#07080b" stroke-width="2.2"/>
  <circle cx="115" cy="67" r="21" fill="url(#cr-haz)" stroke="#07080b" stroke-width="1.4"/>
  <circle cx="115" cy="67" r="16.5" fill="#0c0d10" stroke="#07080b" stroke-width="1.4"/>
  <circle cx="115" cy="67" r="14" fill="url(#cr-core)"/>
  <!-- four armour leaves over the core, with hot gaps between them -->
  <g fill="url(#cr-plate)" stroke="#07080b" stroke-width="1.1" stroke-linejoin="round">
    <path d="M110.6 54.4 L119.4 54.4 L117.6 63 L112.4 63 Z"/>
    <path d="M110.6 54.4 L119.4 54.4 L117.6 63 L112.4 63 Z" transform="rotate(90 115 67)"/>
    <path d="M110.6 54.4 L119.4 54.4 L117.6 63 L112.4 63 Z" transform="rotate(180 115 67)"/>
    <path d="M110.6 54.4 L119.4 54.4 L117.6 63 L112.4 63 Z" transform="rotate(270 115 67)"/>
  </g>
  <circle cx="115" cy="67" r="3.4" fill="#fff6d8"/>
  <g fill="#2a2e36" stroke="#07080b" stroke-width="1"><rect x="111" y="40" width="8" height="5"/><rect x="111" y="89" width="8" height="5"/><rect x="88" y="63" width="5" height="8"/><rect x="137" y="63" width="5" height="8"/></g>

  <!-- the side gun mounts (the guns sit on top of these) -->
  <g transform="translate(53 81)">
    <path d="M-12 -24 L12 -24 L22 -14 L22 16 L12 26 L-12 26 L-22 16 L-22 -14 Z" fill="url(#cr-plate)" stroke="#07080b" stroke-width="2"/>
    <circle r="15" fill="url(#cr-scorch)" stroke="#07080b" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4cad6"><circle cx="-17" cy="-10" r="1.3"/><circle cx="17" cy="-10" r="1.3"/><circle cx="-17" cy="12" r="1.3"/><circle cx="17" cy="12" r="1.3"/></g>
  </g>
  <g transform="translate(177 81)">
    <path d="M-12 -24 L12 -24 L22 -14 L22 16 L12 26 L-12 26 L-22 16 L-22 -14 Z" fill="url(#cr-plate)" stroke="#07080b" stroke-width="2"/>
    <circle r="15" fill="url(#cr-scorch)" stroke="#07080b" stroke-width="1.5"/>
    <path d="M-8 -6 L-3 0 L-7 7 M7 -8 L3 -2 L8 4" stroke="#ff7a1a" stroke-width="1" fill="none" opacity="0.6"/>
    <g fill="#c4cad6"><circle cx="-17" cy="-10" r="1.3"/><circle cx="17" cy="-10" r="1.3"/><circle cx="-17" cy="12" r="1.3"/><circle cx="17" cy="12" r="1.3"/></g>
  </g>

  <!-- the front: a bow plate with a twin main gun -->
  <path d="M84 100 L146 100 L150 126 L80 126 Z" fill="url(#cr-slab)" stroke="#07080b" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="98" y="104" width="34" height="5" rx="1" fill="#07080b"/>
  <rect x="100" y="105.4" width="30" height="2.2" fill="#ff7a1a"/>
  <rect x="104.6" y="112" width="7.4" height="34" fill="url(#cr-barrel)" stroke="#07080b" stroke-width="1.4"/>
  <rect x="118" y="112" width="7.4" height="34" fill="url(#cr-barrel)" stroke="#07080b" stroke-width="1.4"/>
  <!-- the bulldozer blade across the front -->
  <path d="M38 128 L96 128 L98 136 L132 136 L134 128 L192 128 L198 140 L186 148 L44 148 L32 140 Z" fill="url(#cr-plate)" stroke="#07080b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 131 L94 131 L96 139 L134 139 L136 131 L190 131 L194 139 L36 139 Z" fill="url(#cr-haz)" stroke="#07080b" stroke-width="1"/>
  <path d="M44 146 L186 146" stroke="#000000" stroke-width="2" opacity="0.35"/>
  <g fill="#2a2e36" stroke="#07080b" stroke-width="1.2"><rect x="103" y="142" width="10" height="6" rx="1"/><rect x="117" y="142" width="10" height="6" rx="1"/></g>
  <g fill="#ffd8a8"><rect x="50" y="141.6" width="6" height="2.6"/><rect x="174" y="141.6" width="6" height="2.6"/></g>

  <!-- panel lines and rivets -->
  <path d="M46 44 L72 44 M158 44 L184 44 M46 118 L80 118 M150 118 L184 118" stroke="#07080b" stroke-width="1.1" opacity="0.6"/>
  <g fill="#07080b" opacity="0.8">
    <circle cx="60" cy="46" r="1.2"/><circle cx="170" cy="46" r="1.2"/><circle cx="62" cy="112" r="1.2"/><circle cx="168" cy="112" r="1.2"/>
    <circle cx="80" cy="96" r="1.1"/><circle cx="150" cy="96" r="1.1"/><circle cx="38" cy="30" r="1.1"/><circle cx="192" cy="30" r="1.1"/>
  </g>
</svg>
