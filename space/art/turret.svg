<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 64">
  <!-- TURRET on the moon. Its gun points down at your side of the screen
       and fires straight down. Do not sit underneath it! -->
  <defs>
    <linearGradient id="tu-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8bdd0"/><stop offset="0.45" stop-color="#5c6078"/><stop offset="1" stop-color="#1a1d2e"/></linearGradient>
    <radialGradient id="tu-dome" cx="0.35" cy="0.3"><stop offset="0" stop-color="#e0ffe8"/><stop offset="0.35" stop-color="#4dff7c"/><stop offset="0.8" stop-color="#1b8a44"/><stop offset="1" stop-color="#0a3a1a"/></radialGradient>
    <linearGradient id="tu-barrel" x1="0" x2="1"><stop offset="0" stop-color="#c8cde0"/><stop offset="0.5" stop-color="#5c6078"/><stop offset="1" stop-color="#1a1d2e"/></linearGradient>
  </defs>
  <rect x="4" y="6" width="52" height="26" rx="6" fill="url(#tu-base)" stroke="#1a1d2e" stroke-width="2.4"/>
  <rect x="8" y="9" width="44" height="5" rx="2.5" fill="#ffffff" opacity="0.35"/>
  <path d="M8 26 L14 26 M46 26 L52 26" stroke="#ffd23f" stroke-width="3"/>
  <rect x="25.5" y="30" width="9" height="30" rx="2" fill="url(#tu-barrel)" stroke="#1a1d2e" stroke-width="2"/>
  <rect x="25.5" y="56" width="9" height="4" fill="#4dff7c"/>
  <circle cx="30" cy="22" r="15" fill="url(#tu-dome)" stroke="#0a3a1a" stroke-width="2.4"/>
  <ellipse cx="25" cy="16.5" rx="4.5" ry="3" fill="#ffffff" opacity="0.85"/>
  <circle cx="30" cy="23" r="5" fill="#0a3a1a"/>
</svg>
