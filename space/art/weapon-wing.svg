<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70">
  <!-- THE MISSILE WING. When the boss gets angry this wing slides out
       of its side with four missiles hanging under it. The red tips
       at the bottom are the warheads. This is the LEFT wing. The game
       flips it over to make the right one.
       Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="ww-wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8cedb"/><stop offset="0.35" stop-color="#6a7284"/><stop offset="0.75" stop-color="#323744"/><stop offset="1" stop-color="#14161c"/></linearGradient>
    <linearGradient id="ww-body" x1="0" x2="1"><stop offset="0" stop-color="#e2e6ec"/><stop offset="0.4" stop-color="#8a92a2"/><stop offset="1" stop-color="#262a34"/></linearGradient>
    <linearGradient id="ww-head" x1="0" x2="1"><stop offset="0" stop-color="#ff9a8a"/><stop offset="0.45" stop-color="#ff2a2a"/><stop offset="1" stop-color="#7a0808"/></linearGradient>
    <pattern id="ww-haz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#14161b"/><rect width="3.5" height="7" fill="#f0b51c"/></pattern>
  </defs>

  <!-- the wing itself. The flat right edge plugs into the boss. -->
  <path d="M120 6 L64 4 L6 1 L2 16 L34 30 L120 44 Z" fill="#000000" opacity="0.35" transform="translate(3 3)"/>
  <path d="M120 6 L64 4 L6 1 L2 16 L34 30 L120 44 Z" fill="url(#ww-wing)" stroke="#0c0d12" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M116 9 L64 7.5 L8 4.5 L6 9 L64 12 L116 14 Z" fill="#ffffff" opacity="0.3"/>
  <!-- hazard stripe along the front edge -->
  <path d="M2 16 L34 30 L120 44 L120 38 L36 25 L6 12 Z" fill="url(#ww-haz)" stroke="#0c0d12" stroke-width="1"/>
  <!-- panel lines and the orange glow strip at the root -->
  <path d="M40 3 L36 24 M78 5 L76 33 M100 6 L100 37" stroke="#0c0d12" stroke-width="1" opacity="0.6"/>
  <rect x="112" y="6" width="5" height="34" fill="#22252e" stroke="#0c0d12" stroke-width="1"/>
  <rect x="113.5" y="8" width="2" height="30" fill="#ff8a1a"/>
  <g fill="#c4cad8"><circle cx="20" cy="6" r="1.1"/><circle cx="56" cy="8" r="1.1"/><circle cx="88" cy="9" r="1.1"/><circle cx="108" cy="10" r="1.1"/></g>
  <!-- the rack the missiles hang from -->
  <rect x="14" y="12" width="88" height="5" rx="1.5" fill="#2a2e38" stroke="#0c0d12" stroke-width="1.3"/>
  <rect x="16" y="13.5" width="84" height="1.2" fill="#ff8a1a" opacity="0.8"/>

  <!-- four missiles pointing down -->
  <g transform="translate(24 0)">
    <path d="M-4.5 26 L-8 20 L-8 16 L-3 20 L3 20 L8 16 L8 20 L4.5 26 Z" fill="#2a2e38" stroke="#0c0d12" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="-4.5" y="18" width="9" height="36" rx="2" fill="url(#ww-body)" stroke="#0c0d12" stroke-width="1.4"/>
    <rect x="-4.5" y="28" width="9" height="3" fill="#ff8a1a" stroke="#0c0d12" stroke-width="0.8"/>
    <rect x="-3" y="20" width="1.6" height="30" fill="#ffffff" opacity="0.45"/>
    <path d="M-4.5 50 L4.5 50 L4.5 54 Q4.5 58 0 62 Q-4.5 58 -4.5 54 Z" fill="url(#ww-head)" stroke="#0c0d12" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-2.6 52 Q-2.6 56 -0.6 58.5" stroke="#ffd0c0" stroke-width="1.1" fill="none" opacity="0.8"/>
    <path d="M-4.5 46 L-8 52 L-4.5 51 Z M4.5 46 L8 52 L4.5 51 Z" fill="#3a404e" stroke="#0c0d12" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="0" cy="17" r="2.6" fill="#0c0d12"/>
    <circle cx="0" cy="17" r="1.4" fill="#ffb04a"/>
  </g>
  <g transform="translate(46 0)">
    <path d="M-4.5 26 L-8 20 L-8 16 L-3 20 L3 20 L8 16 L8 20 L4.5 26 Z" fill="#2a2e38" stroke="#0c0d12" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="-4.5" y="18" width="9" height="36" rx="2" fill="url(#ww-body)" stroke="#0c0d12" stroke-width="1.4"/>
    <rect x="-4.5" y="28" width="9" height="3" fill="#ff8a1a" stroke="#0c0d12" stroke-width="0.8"/>
    <rect x="-3" y="20" width="1.6" height="30" fill="#ffffff" opacity="0.45"/>
    <path d="M-4.5 50 L4.5 50 L4.5 54 Q4.5 58 0 62 Q-4.5 58 -4.5 54 Z" fill="url(#ww-head)" stroke="#0c0d12" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-2.6 52 Q-2.6 56 -0.6 58.5" stroke="#ffd0c0" stroke-width="1.1" fill="none" opacity="0.8"/>
    <path d="M-4.5 46 L-8 52 L-4.5 51 Z M4.5 46 L8 52 L4.5 51 Z" fill="#3a404e" stroke="#0c0d12" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="0" cy="17" r="2.6" fill="#0c0d12"/>
    <circle cx="0" cy="17" r="1.4" fill="#ffb04a"/>
  </g>
  <g transform="translate(68 0)">
    <path d="M-4.5 26 L-8 20 L-8 16 L-3 20 L3 20 L8 16 L8 20 L4.5 26 Z" fill="#2a2e38" stroke="#0c0d12" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="-4.5" y="18" width="9" height="36" rx="2" fill="url(#ww-body)" stroke="#0c0d12" stroke-width="1.4"/>
    <rect x="-4.5" y="28" width="9" height="3" fill="#ff8a1a" stroke="#0c0d12" stroke-width="0.8"/>
    <rect x="-3" y="20" width="1.6" height="30" fill="#ffffff" opacity="0.45"/>
    <path d="M-4.5 50 L4.5 50 L4.5 54 Q4.5 58 0 62 Q-4.5 58 -4.5 54 Z" fill="url(#ww-head)" stroke="#0c0d12" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-2.6 52 Q-2.6 56 -0.6 58.5" stroke="#ffd0c0" stroke-width="1.1" fill="none" opacity="0.8"/>
    <path d="M-4.5 46 L-8 52 L-4.5 51 Z M4.5 46 L8 52 L4.5 51 Z" fill="#3a404e" stroke="#0c0d12" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="0" cy="17" r="2.6" fill="#0c0d12"/>
    <circle cx="0" cy="17" r="1.4" fill="#ffb04a"/>
  </g>
  <g transform="translate(90 0)">
    <path d="M-4.5 26 L-8 20 L-8 16 L-3 20 L3 20 L8 16 L8 20 L4.5 26 Z" fill="#2a2e38" stroke="#0c0d12" stroke-width="1.1" stroke-linejoin="round"/>
    <rect x="-4.5" y="18" width="9" height="36" rx="2" fill="url(#ww-body)" stroke="#0c0d12" stroke-width="1.4"/>
    <rect x="-4.5" y="28" width="9" height="3" fill="#ff8a1a" stroke="#0c0d12" stroke-width="0.8"/>
    <rect x="-3" y="20" width="1.6" height="30" fill="#ffffff" opacity="0.45"/>
    <path d="M-4.5 50 L4.5 50 L4.5 54 Q4.5 58 0 62 Q-4.5 58 -4.5 54 Z" fill="url(#ww-head)" stroke="#0c0d12" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-2.6 52 Q-2.6 56 -0.6 58.5" stroke="#ffd0c0" stroke-width="1.1" fill="none" opacity="0.8"/>
    <path d="M-4.5 46 L-8 52 L-4.5 51 Z M4.5 46 L8 52 L4.5 51 Z" fill="#3a404e" stroke="#0c0d12" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="0" cy="17" r="2.6" fill="#0c0d12"/>
    <circle cx="0" cy="17" r="1.4" fill="#ffb04a"/>
  </g>
</svg>
