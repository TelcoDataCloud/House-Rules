<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160">
  <!-- One leg of Omega, the final boss, seen from above. The hip joint
       at the top goes under its body, and the huge armoured foot is at
       the bottom. In the first fight you can shoot these legs off.
       Hendrix: every fill is a colour. -->
  <defs>
    <linearGradient id="ol-armour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#aeacc2"/><stop offset="0.35" stop-color="#55536a"/><stop offset="0.75" stop-color="#262534"/><stop offset="1" stop-color="#0c0b12"/></linearGradient>
    <linearGradient id="ol-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5c72"/><stop offset="0.5" stop-color="#2a2938"/><stop offset="1" stop-color="#0c0b12"/></linearGradient>
    <linearGradient id="ol-rod" x1="0" x2="1"><stop offset="0" stop-color="#e2e0ee"/><stop offset="0.5" stop-color="#7a788e"/><stop offset="1" stop-color="#22212c"/></linearGradient>
    <linearGradient id="ol-strip" x1="0" x2="1"><stop offset="0" stop-color="#ffb3dc"/><stop offset="0.5" stop-color="#ff3fa4"/><stop offset="1" stop-color="#8a0a52"/></linearGradient>
    <pattern id="ol-haz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#121118"/><rect width="3.5" height="7" fill="#f0b51c"/></pattern>
  </defs>
  <!-- the hip joint -->
  <circle cx="45" cy="14" r="13" fill="url(#ol-dark)" stroke="#05050a" stroke-width="2.2"/>
  <circle cx="45" cy="14" r="6" fill="#141320" stroke="#ff3fa4" stroke-width="1.6"/>
  <!-- hydraulic rods -->
  <rect x="20" y="28" width="5" height="82" fill="url(#ol-rod)" stroke="#05050a" stroke-width="1.1"/>
  <rect x="65" y="28" width="5" height="82" fill="url(#ol-rod)" stroke="#05050a" stroke-width="1.1"/>
  <g fill="#2a2938" stroke="#05050a" stroke-width="1"><rect x="18.6" y="60" width="7.8" height="6"/><rect x="63.6" y="60" width="7.8" height="6"/></g>
  <!-- the thigh armour -->
  <path d="M30 22 L60 22 L67 32 L63 72 L27 72 L23 32 Z" fill="url(#ol-armour)" stroke="#05050a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M31 24.4 L46 24.4 L45 27 L32 27 L26 33 L29 68 L27.6 68 L24.6 32.4 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M60 33 L64.6 33 L61 70 L57 70 Z" fill="#000000" opacity="0.25"/>
  <path d="M26 46 L64 46" stroke="#05050a" stroke-width="1.1" opacity="0.6"/>
  <rect x="36" y="52" width="18" height="4" rx="1" fill="#05050a"/>
  <rect x="37.4" y="53" width="15.2" height="2" fill="url(#ol-strip)"/>
  <!-- the knee guard with a spike -->
  <path d="M22 70 L68 70 L74 82 L64 94 L26 94 L16 82 Z" fill="url(#ol-armour)" stroke="#05050a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M38 74 L52 74 L45 98 Z" fill="url(#ol-dark)" stroke="#05050a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M24 82 L36 82 L36 88 L26 88 Z M66 82 L54 82 L54 88 L64 88 Z" fill="url(#ol-haz)" stroke="#05050a" stroke-width="0.9"/>
  <path d="M23 71.8 L45 71.8 L44 74 L24 74 L18.6 82 L17.6 81.6 Z" fill="#ffffff" opacity="0.3"/>
  <!-- the shin -->
  <path d="M31 92 L59 92 L61 120 L29 120 Z" fill="url(#ol-dark)" stroke="#05050a" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#05050a"><rect x="35" y="100" width="20" height="2"/><rect x="35" y="105" width="20" height="2"/><rect x="35" y="110" width="20" height="2"/></g>
  <g fill="#ff7a1a" opacity="0.85"><rect x="37" y="100.5" width="16" height="1"/><rect x="37" y="105.5" width="16" height="1"/></g>
  <!-- the claws at the front of the foot -->
  <path d="M10 140 L4 158 L18 150 L24 140 Z M36 144 L45 160 L54 144 Z M80 140 L86 158 L72 150 L66 140 Z" fill="#1c1b26" stroke="#05050a" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- the huge armoured foot -->
  <path d="M20 116 L70 116 L84 128 L86 138 L76 148 L14 148 L4 138 L6 128 Z" fill="url(#ol-armour)" stroke="#05050a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M21 118.6 L50 118.6 L49 121 L22 121 L9 129.6 L7.4 137 L6.4 136.6 L7.6 128.4 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M5 134 L85 134 M27 134 L27 148 M45 134 L45 148 M63 134 L63 148" stroke="#05050a" stroke-width="1.2" opacity="0.6"/>
  <path d="M14 146 L76 146" stroke="url(#ol-strip)" stroke-width="2"/>
  <!-- the ankle joint -->
  <circle cx="45" cy="122" r="7.6" fill="#2a2938" stroke="#05050a" stroke-width="1.6"/>
  <circle cx="45" cy="122" r="3" fill="#ff3fa4"/>
  <g fill="#05050a" opacity="0.8"><circle cx="14" cy="130" r="1.2"/><circle cx="76" cy="130" r="1.2"/><circle cx="18" cy="141" r="1.1"/><circle cx="72" cy="141" r="1.1"/><circle cx="32" cy="27" r="1"/><circle cx="58" cy="27" r="1"/></g>
</svg>
